}

// ── Zyklus-Korrelation ────────────────────────────────────────────
function renderZyklusKorrelation(logs) {
  if(!state.zyklusStart) return '';

  // Für jeden Log-Eintrag die Zyklusphase zum jeweiligen Datum berechnen
  const mitPhase = logs.map(l => {
    const diff = Math.floor((new Date(l.datum) - new Date(state.zyklusStart)) / 86400000);
    const tag = ((diff % state.zyklusLaenge) + state.zyklusLaenge) % state.zyklusLaenge + 1;
    let phase = 'follikel';
    if(tag <= 5) phase = 'menstruation';
    else if(tag <= 13) phase = 'follikel';
    else if(tag === 14) phase = 'ovulation';
    else phase = 'luteal';
    return { ...l, phase };
  });

  const phasen = ['menstruation','follikel','ovulation','luteal'];
  const phasenLabels = { menstruation:'🌕 Periode', follikel:'🌱 Follikel', ovulation:'🌸 Eisprung', luteal:'🍂 Luteal' };

  const stats = phasen.map(p => {
    const tage = mitPhase.filter(l => l.phase === p);
    if(!tage.length) return null;
    const avgSchmerz = tage.reduce((s,l)=>s+(l.schmerz??0),0) / tage.length;
    const avgReflux = tage.reduce((s,l)=>s+(l.reflux??0),0) / tage.length;
    return { phase: p, label: phasenLabels[p], count: tage.length, avgSchmerz, avgReflux };
  }).filter(Boolean);

  if(stats.length < 2) return '';

  const schlechtesteStats = [...stats].sort((a,b)=>b.avgSchmerz-a.avgSchmerz)[0];
  const besteStats = [...stats].sort((a,b)=>a.avgSchmerz-b.avgSchmerz)[0];
  const relevant = (schlechtesteStats.avgSchmerz - besteStats.avgSchmerz) >= 1;

  return `
    <div class="card">
      <div class="card-title">🌸 Zyklus & Beschwerden</div>
      ${relevant ? `<p class="fs-sm" style="line-height:1.7;margin-bottom:12px">
        Deine Bauchbeschwerden sind in der <strong>${schlechtesteStats.label}</strong>-Phase am stärksten
        (Ø ${schlechtesteStats.avgSchmerz.toFixed(1)}/10) und in der <strong>${besteStats.label}</strong>-Phase
        am schwächsten (Ø ${besteStats.avgSchmerz.toFixed(1)}/10).
      </p>` : `<p class="fs-sm c-lt mb12">Beschwerden verteilen sich relativ gleichmäßig über den Zyklus.</p>`}
      <div style="display:flex;gap:8px;overflow-x:auto">
        ${stats.map(s=>`
        <div style="flex-shrink:0;background:var(--cream);border-radius:10px;padding:10px 12px;text-align:center;min-width:90px;${s.phase===schlechtesteStats.phase&&relevant?'border:1.5px solid #D97474':''}">
          <div class="fs-xs c-lt">${s.label}</div>
          <div class="fw-8 c-warm">${s.avgSchmerz.toFixed(1)}</div>
          <div class="fs-xs c-lt">${s.count} Tage</div>
        </div>`).join('')}
      </div>
      <p class="fs-xs c-lt mt8">💡 Hormonschwankungen beeinflussen die Darmmotilität – das ist medizinisch gut belegt.</p>
    </div>`;
}

// ── Symptom-Muster: welche Symptome treten zusammen auf ────────────
function renderSymptomMuster(logs) {
  const mitSymptomen = logs.filter(l => l.symptome_heute?.length > 0);
  if(mitSymptomen.length < 4) return '';

  // Häufigkeit zählen
  const count = {};
  mitSymptomen.forEach(l => l.symptome_heute.forEach(s => { count[s] = (count[s]||0) + 1; }));
  const top = Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // Ko-Okkurrenz: welche Symptome treten gemeinsam auf
  const pairs = {};
  mitSymptomen.forEach(l => {
    const syms = l.symptome_heute;
    for(let i=0; i<syms.length; i++) {
      for(let j=i+1; j<syms.length; j++) {
        const key = [syms[i],syms[j]].sort().join(' + ');
        pairs[key] = (pairs[key]||0) + 1;
      }
    }
  });
  const topPairs = Object.entries(pairs).filter(([k,v])=>v>=2).sort((a,b)=>b[1]-a[1]).slice(0,3);

  return `
    <div class="card">
      <div class="card-title">📋 Symptom-Muster</div>
      <p class="fs-xs c-lt mb12">Häufigste Beschwerden im Zeitraum</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:${topPairs.length?'14px':'0'}">
        ${top.map(([s,n])=>`<span class="tag tag-y" style="font-size:.8rem">${s} <strong>(${n}×)</strong></span>`).join('')}
      </div>
      ${topPairs.length ? `
      <div class="fw-7 fs-sm c-warm mb8">Treten häufig gemeinsam auf:</div>
      ${topPairs.map(([pair,n])=>`
      <div style="background:var(--cream);border-radius:8px;padding:8px 12px;margin-bottom:5px;font-size:.82rem">
        ${pair} <span class="c-lt">— ${n}× gemeinsam</span>
      </div>`).join('')}` : ''}
    </div>`;
}

// ── Überraschende Funde: Verträglichkeits-Markierungen vs. tatsächliche Bewertungen ──
// ── Getränke-Auswertung ──────────────────────────────────────────
function renderGetraenkeKorrelation(meals) {
  const getraenke = meals.filter(m => m.typ === 'Getränke');
  if(getraenke.length < 3) return '';

  // Häufigkeit pro Getränk
  const count = {};
  getraenke.forEach(g => { count[g.name] = (count[g.name]||0) + 1; });
  const top = Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,6);

  // Verträglichkeit pro Getränk (nur bewertete)
  const bewertete = getraenke.filter(g => g.bew > 0);
  const stats = {};
  bewertete.forEach(g => {
    if(!stats[g.name]) stats[g.name] = [];
    stats[g.name].push(g.bew);
  });
  const schlecht = Object.entries(stats)
    .map(([name, bews]) => ({ name, avg: bews.reduce((a,b)=>a+b,0)/bews.length, count: bews.length }))
    .filter(x => x.count >= 2 && x.avg <= 2.5)
    .sort((a,b) => a.avg - b.avg);

  // Reflux-Trigger-Getränke die häufig getrunken werden
  const refluxTrigger = getraenke.filter(g => g.reflux === 'r');
  const refluxTriggerCount = {};
  refluxTrigger.forEach(g => { refluxTriggerCount[g.name] = (refluxTriggerCount[g.name]||0) + 1; });
  const haeufigeRefluxTrigger = Object.entries(refluxTriggerCount).filter(([k,v])=>v>=3).sort((a,b)=>b[1]-a[1]);

  return `
    <div class="card">
      <div class="card-title">💧 Getränke-Auswertung</div>
      <p class="fs-xs c-lt mb12">${getraenke.length} Getränke erfasst im Zeitraum</p>

      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:${schlecht.length||haeufigeRefluxTrigger.length?'14px':'0'}">
        ${top.map(([name,n])=>`<span class="tag tag-b" style="font-size:.78rem">${esc(name)} (${n}×)</span>`).join('')}
      </div>

      ${haeufigeRefluxTrigger.length ? `
      <div style="background:#FFF0E0;border:1.5px solid #F5C5A3;border-radius:12px;padding:12px 14px;margin-bottom:${schlecht.length?'12px':'0'}">
        <div class="fw-7" style="font-size:.82rem;color:#9B5800;margin-bottom:6px">🔥 Häufige Reflux-Trigger-Getränke</div>
        <p class="fs-sm" style="line-height:1.6">
          ${haeufigeRefluxTrigger.map(([name,n])=>`<strong>${esc(name)}</strong> (${n}×)`).join(', ')}
          ${haeufigeRefluxTrigger.length===1?' wird':' werden'} regelmäßig getrunken, obwohl ${haeufigeRefluxTrigger.length===1?'es':'sie'} als Reflux-Trigger gilt/gelten.
        </p>
      </div>` : ''}

      ${schlecht.length ? `
      <div>
        <div class="fw-7 fs-sm" style="color:#9B2222;margin-bottom:6px">😣 Schlecht vertragene Getränke</div>
        ${schlecht.map(x=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#FFF5F5;border-radius:8px;margin-bottom:4px">
          <span class="fs-sm">${esc(x.name)}</span>
          <span class="fs-xs c-lt">${'⭐'.repeat(Math.round(x.avg))} (${x.count}×)</span>
        </div>`).join('')}
      </div>` : ''}

      <p class="fs-xs c-lt mt8">💡 Kaffee, Alkohol und kohlensäurehaltige Getränke entspannen den unteren Speiseröhrenschließmuskel und sind häufige Reflux-Auslöser – unabhängig vom FODMAP-Gehalt.</p>
    </div>`;
}

// ── Bristol-Analyse ───────────────────────────────────────────────
function renderBristolAnalyse(stuhl, meals) {
  if(stuhl.length < 3) return '';

  // Häufigkeit der Typen
  const count = {};
  stuhl.forEach(s => { count[s.bristolTyp] = (count[s.bristolTyp]||0)+1; });
  const häufigster = Object.entries(count).sort((a,b)=>b[1]-a[1])[0];
  const häufigstes = BRISTOL.find(b=>b.typ===Number(häufigster[0]));

  // Durchschnittlicher Typ
  const avg = stuhl.reduce((s,x)=>s+x.bristolTyp,0)/stuhl.length;

  // Trend über Zeit: erste Hälfte vs zweite Hälfte
  const sorted = [...stuhl].sort((a,b)=>a.datum.localeCompare(b.datum));
  const half = Math.floor(sorted.length/2);
  const ersteHälfte = sorted.slice(0,half);
  const zweiteHälfte = sorted.slice(half);
  const avgErs = ersteHälfte.length ? ersteHälfte.reduce((s,x)=>s+x.bristolTyp,0)/ersteHälfte.length : 0;
  const avgZwei = zweiteHälfte.length ? zweiteHälfte.reduce((s,x)=>s+x.bristolTyp,0)/zweiteHälfte.length : 0;
  const trend = avgZwei - avgErs;

  // Korrelation mit Mahlzeiten: Reflexzeit ~8h prüfen
  // An Tagen mit hohem Reflux-Essen (fodmap:'r') häufiger Typ 6/7?
  const tageHighFODMAP = new Set(meals.filter(m=>m.fodmap==='r').map(m=>m.datum));
  const stuhlNachHighFODMAP = stuhl.filter(s=>tageHighFODMAP.has(s.datum));
  const stuhlNachNormal = stuhl.filter(s=>!tageHighFODMAP.has(s.datum));
  const avgNachHighFODMAP = stuhlNachHighFODMAP.length ? stuhlNachHighFODMAP.reduce((s,x)=>s+x.bristolTyp,0)/stuhlNachHighFODMAP.length : 0;
  const avgNachNormal = stuhlNachNormal.length ? stuhlNachNormal.reduce((s,x)=>s+x.bristolTyp,0)/stuhlNachNormal.length : 0;

  return `
    <div class="card">
      <div class="card-title">💩 Stuhlgang-Analyse (Bristol-Skala)</div>
      <p class="fs-xs c-lt mb12">${stuhl.length} Einträge · Normalbereich: Typ 3–4</p>

      <!-- Typ-Verteilung als Mini-Balkengrafik -->
      <div style="margin-bottom:16px">
        ${BRISTOL.map(b=>{
          const n = count[b.typ]||0;
          const pct = stuhl.length ? Math.round((n/stuhl.length)*100) : 0;
          if(!n) return '';
          return `
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <div style="width:32px;height:20px;display:flex;align-items:center;flex-shrink:0">${b.shape}</div>
            <span class="fs-xs fw-7" style="width:14px;flex-shrink:0;color:${b.farbe}">${b.typ}</span>
            <div style="flex:1;background:var(--border);border-radius:10px;height:12px;overflow:hidden">
              <div style="width:${pct}%;height:100%;background:${b.farbe};border-radius:10px;transition:width .5s"></div>
            </div>
            <span class="fs-xs c-lt" style="width:36px;flex-shrink:0">${n}× (${pct}%)</span>
          </div>`;
        }).join('')}
      </div>

      <!-- Auswertung -->
      <div style="background:${avg>=3&&avg<=4?'#EDF5EE':'#FFF0E0'};border-radius:12px;padding:12px 14px;margin-bottom:12px">
        <div class="fw-7 fs-sm" style="color:${avg>=3&&avg<=4?'#2D6B30':'#9B5800'};margin-bottom:4px">
          ${avg>=3&&avg<=4?'✅ Stuhlgang im Normalbereich':'⚠️ Stuhlgang außerhalb des Normalbereichs'}
        </div>
        <p class="fs-sm" style="line-height:1.6">
          Häufigster Typ: <strong>${häufigstes?.emoji} ${häufigstes?.label}</strong><br>
          Durchschnitt: Typ ${avg.toFixed(1)}
          ${avg<3?' — Tendenz zu Verstopfung (zu langsame Passage)':''}
          ${avg>4?' — Tendenz zu Durchfall (zu schnelle Passage)':''}
          ${avg>=3&&avg<=4?' — gut!':''}
        </p>
      </div>

      ${Math.abs(trend)>=0.5 ? `
      <div class="fs-sm c-lt" style="margin-bottom:10px">
        📈 Trend im Zeitraum: ${trend>0?'Richtung Durchfall (weicher werdend)':'Richtung Verstopfung (fester werdend)'} (${trend>0?'+':''}${trend.toFixed(1)} Typen)
      </div>` : ''}

      ${stuhlNachHighFODMAP.length>=2 && stuhlNachNormal.length>=2 && Math.abs(avgNachHighFODMAP-avgNachNormal)>=0.8 ? `
      <div style="background:#FFF5F5;border-radius:10px;padding:10px 12px;font-size:.82rem">
        🔬 <strong>Zusammenhang mit Ernährung:</strong> An Tagen mit High-FODMAP-Essen war der Stuhltyp im Schnitt ${avgNachHighFODMAP>avgNachNormal?'weicher (Richtung Durchfall)':'fester (Richtung Verstopfung)'} als an normalen Tagen.
      </div>` : ''}
    </div>`;
}

// ── Symptom-Zeit-Analyse ──────────────────────────────────────────
function renderSymptomZeitAnalyse(symZeit, meals) {
  if(symZeit.length < 3) return '';

  // Häufigste Symptome mit Uhrzeit
  const count = {};
  symZeit.forEach(s => s.symptome.forEach(sym => { count[sym]=(count[sym]||0)+1; }));
  const top = Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // Tageszeitliche Häufung
  const stunden = { morgen:[], mittag:[], nachmittag:[], abend:[], nacht:[] };
  symZeit.forEach(s => {
    const h = parseInt(s.uhrzeit?.split(':')[0])||0;
    if(h>=5&&h<10)       stunden.morgen.push(s);
    else if(h>=10&&h<14) stunden.mittag.push(s);
    else if(h>=14&&h<18) stunden.nachmittag.push(s);
    else if(h>=18&&h<23) stunden.abend.push(s);
    else                 stunden.nacht.push(s);
  });
  const zeitSlots = [
    {key:'morgen',label:'🌅 Morgen (5–10h)'},
    {key:'mittag',label:'☀️ Mittag (10–14h)'},
    {key:'nachmittag',label:'🌤 Nachmittag (14–18h)'},
    {key:'abend',label:'🌙 Abend (18–23h)'},
    {key:'nacht',label:'🌑 Nacht (23–5h)'},
  ].filter(z=>stunden[z.key].length>0);

  // Schwerster Zeitpunkt
  const schlimmsteZeit = zeitSlots.sort((a,b)=>{
    const avgA = stunden[a.key].reduce((s,x)=>s+(x.intensitaet||0),0)/stunden[a.key].length;
    const avgB = stunden[b.key].reduce((s,x)=>s+(x.intensitaet||0),0)/stunden[b.key].length;
    return avgB-avgA;
  })[0];

  // Korrelation: Symptome wie lange nach Mahlzeiten?
  const symptomNachMahlzeit = [];
  symZeit.forEach(s => {
    const symMinuten = timeToMin(s.uhrzeit);
    const mahlzeitenHeute = meals.filter(m=>m.datum===s.datum&&m.uhrzeit);
    mahlzeitenHeute.forEach(m => {
      const mMin = timeToMin(m.uhrzeit);
      const diff = symMinuten - mMin;
      if(diff > 0 && diff <= 240) symptomNachMahlzeit.push({ diff, mahlzeit:m.name, symptome:s.symptome });
    });
  });
  const avgAbstand = symptomNachMahlzeit.length ?
    Math.round(symptomNachMahlzeit.reduce((s,x)=>s+x.diff,0)/symptomNachMahlzeit.length) : null;

  return `
    <div class="card">
      <div class="card-title">⏱️ Symptome nach Uhrzeit</div>
      <p class="fs-xs c-lt mb12">${symZeit.length} Einträge mit Zeitstempel</p>

      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px">
        ${top.map(([s,n])=>`<span class="tag tag-y" style="font-size:.78rem">${s} (${n}×)</span>`).join('')}
      </div>

      ${schlimmsteZeit ? `
      <div style="background:var(--cream);border-radius:10px;padding:10px 14px;margin-bottom:12px">
        <div class="fw-7 fs-sm c-warm mb6">Tageszeit-Verteilung</div>
        ${zeitSlots.map(z=>{
          const avg = stunden[z.key].length ? stunden[z.key].reduce((s,x)=>s+(x.intensitaet||0),0)/stunden[z.key].length : 0;
          const pct = symZeit.length ? Math.round((stunden[z.key].length/symZeit.length)*100) : 0;
          return `
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
            <span class="fs-xs" style="width:130px;flex-shrink:0">${z.label}</span>
            <div style="flex:1;background:var(--border);border-radius:10px;height:10px;overflow:hidden">
              <div style="width:${pct}%;height:100%;background:var(--rose);border-radius:10px"></div>
            </div>
            <span class="fs-xs c-lt" style="width:54px;flex-shrink:0">${stunden[z.key].length}× (Ø ${avg.toFixed(1)})</span>
          </div>`;
        }).join('')}
      </div>` : ''}

      ${avgAbstand ? `
      <div style="background:#EDF5EE;border-radius:10px;padding:10px 14px;font-size:.82rem">
        🍽️ <strong>Mahlzeiten-Zusammenhang:</strong> Beschwerden treten im Schnitt <strong>${avgAbstand} Minuten nach einer Mahlzeit</strong> auf
        (${avgAbstand<=30?'sehr schnell – mögliche Unverträglichkeit oder Gastro-ösophagealer Reflux':
           avgAbstand<=90?'typisch für Reizdarm-Reaktion':'langsamer Zusammenhang – evtl. Fermentierung im Darm'}).
      </div>` : ''}
    </div>`;
}

function timeToMin(t) {
  if(!t) return 0;
  const [h,m] = t.split(':').map(Number);
  return h*60+(m||0);
}

// ── Zutaten-Korrelations-Analyse ─────────────────────────────────
function renderZutatenKorrelation(meals, logs, symZeit) {
  // Nur Mahlzeiten mit Zutaten UND Bewertung oder nachfolgenden Symptomen
  const mitZutaten = meals.filter(m => m.zutaten?.length > 0);
  if(mitZutaten.length < 3) return '';

  // Für jede Zutat: alle Mahlzeiten die sie enthalten
  const zutatStats = {};
  mitZutaten.forEach(m => {
    (m.zutaten||[]).forEach(z => {
      const key = z.name;
      if(!zutatStats[key]) zutatStats[key] = { name:key, f:z.f, r:z.r, mahlzeiten:[], symptomTage:0 };
      zutatStats[key].mahlzeiten.push(m);
    });
  });

  // Pro Zutat: Durchschnittsbewertung + Symptomhäufigkeit am selben Tag
  const stats = Object.values(zutatStats).map(z => {
    const bewertet = z.mahlzeiten.filter(m=>m.bew>0);
    const avgBew = bewertet.length ? bewertet.reduce((s,m)=>s+m.bew,0)/bewertet.length : null;

    // Symptome die am selben Tag auftraten
    const symptomeTage = z.mahlzeiten.filter(m => {
      const tagesSymptome = (symZeit||[]).filter(s=>s.datum===m.datum);
      const tagesLogs = logs.filter(l=>l.datum===m.datum&&(l.schmerz>5||l.reflux>5));
      return tagesSymptome.length > 0 || tagesLogs.length > 0;
    });
    const symptomRate = z.mahlzeiten.length > 0 ? symptomeTage.length / z.mahlzeiten.length : 0;

    return { ...z, avgBew, symptomRate, count: z.mahlzeiten.length, bewertetCount: bewertet.length };
  }).filter(z => z.count >= 2); // mindestens 2x gegessen

  if(!stats.length) return '';

  // Sortierungen
  const verdaechtig = stats
    .filter(z => (z.avgBew!==null && z.avgBew<=2.5) || z.symptomRate>=0.6)
    .sort((a,b) => (b.symptomRate - a.symptomRate) || (a.avgBew||5)-(b.avgBew||5))
    .slice(0,8);

  const gutVertragen = stats
    .filter(z => z.avgBew!==null && z.avgBew>=4 && z.symptomRate<0.3)
    .sort((a,b) => b.avgBew-a.avgBew)
    .slice(0,6);

  // Überraschende Funde: FODMAP-grün aber trotzdem verdächtig
  const ueberraschend = verdaechtig.filter(z => z.f === 'g');

  return `
    <div class="card">
      <div class="card-title">🥕 Zutaten-Korrelation</div>
      <p class="fs-xs c-lt mb12">${mitZutaten.length} Mahlzeiten mit Zutaten-Tracking · ${stats.length} verschiedene Zutaten analysiert</p>

      ${ueberraschend.length ? `
      <div style="background:#FFF0E0;border:1.5px solid #F5C5A3;border-radius:12px;padding:12px 14px;margin-bottom:14px">
        <div class="fw-7 mb6" style="font-size:.85rem;color:#9B5800">🔍 Low-FODMAP aber verdächtig</div>
        <p class="fs-xs c-lt mb8">Diese Zutaten gelten als Low-FODMAP, treten aber häufig zusammen mit Beschwerden auf:</p>
        ${ueberraschend.map(z=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #F5C5A3">
          <span class="fs-sm fw-7">${esc(z.name)}
            <span class="tag ${tagCls(z.f)}" style="font-size:.6rem;margin-left:4px">F: ${tagTxt(z.f)}</span>
          </span>
          <div style="text-align:right">
            ${z.avgBew!==null?`<div class="fs-xs">${'⭐'.repeat(Math.round(z.avgBew))} Ø${z.avgBew.toFixed(1)}</div>`:''}
            <div class="fs-xs c-lt">${Math.round(z.symptomRate*100)}% Sympt.-Tage (${z.count}×)</div>
          </div>
        </div>`).join('')}
        <p class="fs-xs c-lt mt8">💡 Individuelle Unverträglichkeit kann trotz Low-FODMAP bestehen — z.B. durch Histamin, Lektine oder Zubereitungsart. Im Lebensmittelverzeichnis als "vertrage ich nicht" markieren.</p>
      </div>` : ''}

      ${verdaechtig.length ? `
      <div class="mb12">
        <div class="fw-7 fs-sm" style="color:#9B2222;margin-bottom:8px">😣 Häufig bei Beschwerden dabei</div>
        ${verdaechtig.map(z=>`
        <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:#FFF5F5;border-radius:8px;margin-bottom:4px">
          <span class="fs-sm fw-7" style="flex:1">${esc(z.name)}</span>
          <span class="tag ${tagCls(z.f)}" style="font-size:.6rem">F</span>
          <span class="tag ${tagCls(z.r)}" style="font-size:.6rem">R</span>
          <div style="text-align:right;flex-shrink:0">
            ${z.avgBew!==null?`<div class="fs-xs">${'⭐'.repeat(Math.round(z.avgBew))} Ø${z.avgBew.toFixed(1)}</div>`:''}
            <div class="fs-xs c-lt">${z.count}× gegessen</div>
          </div>
        </div>`).join('')}
      </div>` : '<p class="fs-sm c-lt mb12">Noch keine verdächtigen Zutaten-Muster erkennbar. Weiter tracken! 💪</p>'}

      ${gutVertragen.length ? `
      <div>
        <div class="fw-7 fs-sm" style="color:#2D6B30;margin-bottom:6px">✅ Gut vertragen</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px">
          ${gutVertragen.map(z=>`<span class="tag tag-g" style="font-size:.78rem">${esc(z.name)} (${z.count}×)</span>`).join('')}
        </div>
      </div>` : ''}
    </div>`;
}

function renderUeberraschendeFunde(meals) {
  // Vergleiche manuelle Toleranz-Markierungen mit tatsächlichen Sterne-Bewertungen
  const widersprueche = [];

  Object.entries(state.toleranz).forEach(([lmName, status]) => {
    if(status !== 'gut') return; // nur "vertrage ich"-Markierungen prüfen
    const stichwort = lmName.toLowerCase().split(' ')[0].split('(')[0].trim();
    const betroffeneMeals = meals.filter(m => m.bew > 0 && m.name.toLowerCase().includes(stichwort));
    if(betroffeneMeals.length < 2) return;
    const avg = betroffeneMeals.reduce((s,m)=>s+m.bew,0) / betroffeneMeals.length;
    if(avg <= 2.5) {
      widersprueche.push({ name: lmName, avg, count: betroffeneMeals.length });
    }
  });

  if(!widersprueche.length) return '';

  return `
    <div class="card" style="background:linear-gradient(135deg,#FFF0E0,#FFE4D4)">
      <div class="card-title">🔍 Widerspruch entdeckt</div>
      <p class="fs-sm" style="line-height:1.65;margin-bottom:10px">
        Du hast folgende Lebensmittel als "vertrage ich" markiert, deine tatsächlichen Bewertungen zeigen aber ein anderes Bild:
      </p>
      ${widersprueche.map(w=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:white;border-radius:8px;margin-bottom:5px">
        <span class="fs-sm fw-7">${esc(w.name)}</span>
        <span class="fs-xs">${'⭐'.repeat(Math.round(w.avg))} <span class="c-lt">(Ø ${w.avg.toFixed(1)}, ${w.count}×)</span></span>
      </div>`).join('')}
      <p class="fs-xs c-lt mt8">💡 Vielleicht hat sich deine Verträglichkeit geändert, oder die schlechten Bewertungen hatten eine andere Ursache (Zubereitung, Kombination, Tagesform). Schau es dir nochmal an!</p>
    </div>`;
}

function renderBericht() {
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-berZeitraum);
  const logs=state.symptomLogs.filter(l=>new Date(l.datum)>=cutoff);
  const meals=state.mahlzeiten.filter(m=>new Date(m.datum)>=cutoff);
  const avg=(k)=>logs.length?(logs.reduce((s,l)=>s+(l[k]??5),0)/logs.length).toFixed(1):'–';
  const symCount={};
  logs.forEach(l=>(l.symptome_heute||[]).forEach(s=>{symCount[s]=(symCount[s]||0)+1;}));
  const topSym=Object.entries(symCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const schlechtMeals=meals.filter(m=>m.bew<=2&&m.bew>0);
  const gutMeals=meals.filter(m=>m.bew>=4);

  return `
    <h1 class="c-warm" style="font-size:1.5rem;margin-bottom:4px">Gesundheitsbericht</h1>

}

function exportData() {
  const data = {
    version: '1.7',
    exportDatum: today(),
    mahlzeiten: state.mahlzeiten,
    symptomLogs: state.symptomLogs,
    stuhlLogs: state.stuhlLogs,
    symptomZeit: state.symptomZeit,
    wochenplan: state.wochenplan,
    einkaufsliste: state.einkaufsliste,
    eigeneRezepte: state.eigeneRezepte,
    zyklusStart: state.zyklusStart,
    zyklusLaenge: state.zyklusLaenge,
    toleranz: state.toleranz,
    lesezeichen: state.lesezeichen,
    letzterCheck: state.letzterCheck,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'darmglueck-backup-' + today() + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(!data.version) { alert('Ungültige Backup-Datei.'); return; }
      if(data.mahlzeiten)    save('mahlzeiten', data.mahlzeiten);
      if(data.symptomLogs)   save('symptomLogs', data.symptomLogs);
      if(data.stuhlLogs)     save('stuhlLogs', data.stuhlLogs);
      if(data.symptomZeit)   save('symptomZeit', data.symptomZeit);
      if(data.wochenplan)    save('wochenplan', data.wochenplan);
      if(data.einkaufsliste) save('einkaufsliste', data.einkaufsliste);
      if(data.eigeneRezepte) save('eigeneRezepte', data.eigeneRezepte);
      if(data.zyklusStart !== undefined) save('zyklusStart', data.zyklusStart);
      if(data.zyklusLaenge)  save('zyklusLaenge', data.zyklusLaenge);
      if(data.toleranz)      save('toleranz', data.toleranz);
      if(data.lesezeichen)   save('lesezeichen', data.lesezeichen);
      if(data.letzterCheck)  save('letzterCheck', data.letzterCheck);
      const total = (data.mahlzeiten?.length||0) + (data.symptomLogs?.length||0) +
                    (data.stuhlLogs?.length||0) + (data.symptomZeit?.length||0);
      alert('✅ Import erfolgreich!\n' +
        (data.mahlzeiten?.length||0) + ' Mahlzeiten\n' +
        (data.symptomLogs?.length||0) + ' Tages-Check-ins\n' +
        (data.stuhlLogs?.length||0) + ' Stuhlgang-Einträge\n' +
        (data.symptomZeit?.length||0) + ' Symptom-Einträge');
      renderPage();
    } catch(err) {
      alert('Fehler beim Importieren: ' + err.message);
    }
  };
  reader.readAsText(file);
}

  ${schlechtMeals.length?`

          <span style="font-size:1.4rem;flex-shrink:0;margin-top:1px">${a.emoji}</span>

  // Storage-Check: Banner zeigen wenn kein persistenter Speicher
  if(S.isTemp()) {
    const banner = document.getElementById('storage-banner');
    if(banner) banner.style.display = 'block';
  }

  // Tagescheck beim Start
  if(state.letzterCheck !== today()) {

}
