<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Darmglück">
<meta name="theme-color" content="#F5C5A3">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS localStorage: funktioniert am besten wenn aus Home-Bildschirm gestartet -->
<title>🌿 Darmglück</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ─── DESIGN TOKENS ─────────────────────────────────────────────── */
:root {
  --rose:     #E8927C;
  --rose-dk:  #D4745C;
  --peach:    #F5C5A3;
  --cream:    #FDF6EE;
  --cream-dk: #F7EDE0;
  --sage:     #8BAF8D;
  --sage-lt:  #C8DFC9;
  --warm:     #6B4E3D;
  --warm-lt:  #A47860;
  --warm-pale:#EDD8CA;
  --sky:      #A8C8D8;
  --lav:      #C9B8D8;
  --red:      #D97474;
  --yellow:   #F5E0A0;
  --text:     #3D2B1F;
  --text-lt:  #7A5C4E;
  --border:   #EDD8CA;
  --white:    #FFFFFF;
  --sh1: 0 2px 12px rgba(104,60,40,.10);
  --sh2: 0 6px 28px rgba(104,60,40,.14);
  --r:   16px;
}

/* ─── RESET ────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-tap-highlight-color:transparent;scroll-behavior:smooth;}
body{
  font-family:'Nunito',sans-serif;
  background:var(--cream);
  color:var(--text);
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:'Playfair Display',serif;line-height:1.2;}

/* ─── LAYOUT ────────────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;min-height:100dvh;}

/* TOP BAR */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(253,246,238,.92);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:14px 18px 12px;
  display:flex;align-items:center;gap:12px;
}
.topbar-logo{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--warm);flex:1;}
.topbar-logo span{font-size:.7rem;font-weight:600;color:var(--warm-lt);display:block;letter-spacing:.03em;}
.topbar-actions{display:flex;gap:8px;}
.topbar-btn{
  background:none;border:none;cursor:pointer;
  font-size:1.2rem;width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:white;box-shadow:var(--sh1);
  transition:transform .15s;
}
.topbar-btn:hover{transform:scale(1.1);}

/* BOTTOM NAV */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(253,246,238,.95);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:10px 4px 8px;
  border:none;background:none;cursor:pointer;
  font-family:'Nunito',sans-serif;
  font-size:.62rem;font-weight:700;
  color:var(--text-lt);
  transition:color .15s;
  letter-spacing:.02em;
}
.nav-btn .nav-icon{
  font-size:1.35rem;
  transition:transform .2s;
}
.nav-btn.active{color:var(--rose);}
.nav-btn.active .nav-icon{transform:scale(1.18);}

/* MAIN SCROLL */
.main{
  flex:1;
  overflow-y:auto;
  padding:20px 16px 110px;
  -webkit-overflow-scrolling:touch;
}

/* ─── COMPONENTS ────────────────────────────────────────────────── */

/* Cards */
.card{
  background:var(--white);
  border-radius:var(--r);
  box-shadow:var(--sh1);
  padding:18px;
  margin-bottom:14px;
  border:1px solid var(--border);
  animation:fadeUp .3s ease both;
}
.card-title{
  font-family:'Playfair Display',serif;
  font-size:1.05rem;color:var(--warm);
  margin-bottom:12px;
}
.card-sub{font-size:.78rem;color:var(--text-lt);margin-bottom:12px;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:10px 20px;border-radius:30px;border:none;
  cursor:pointer;font-family:'Nunito',sans-serif;
  font-size:.85rem;font-weight:700;
  transition:all .2s;-webkit-tap-highlight-color:transparent;
}
.btn-primary{
  background:linear-gradient(135deg,var(--rose),var(--peach));
  color:white;box-shadow:0 3px 14px rgba(232,146,124,.4);
}
.btn-primary:active{transform:scale(.96);}
.btn-secondary{
  background:var(--white);color:var(--warm);
  border:1.5px solid var(--border);
}
.btn-secondary:active{background:var(--cream-dk);}
.btn-sage{background:var(--sage);color:white;box-shadow:0 3px 10px rgba(139,175,141,.35);}
.btn-sm{padding:7px 14px;font-size:.78rem;}
.btn-xs{padding:5px 10px;font-size:.72rem;}
.btn-full{width:100%;}
.btn-icon{padding:10px;border-radius:50%;}

/* Inputs */
.input,.textarea,.select{
  width:100%;padding:11px 14px;
  border:1.5px solid var(--border);
  border-radius:12px;
  font-family:'Nunito',sans-serif;font-size:.88rem;
  background:var(--cream);color:var(--text);
  outline:none;transition:border-color .2s;
  -webkit-appearance:none;appearance:none;
}
.input:focus,.textarea:focus,.select:focus{border-color:var(--rose);}
.textarea{resize:vertical;min-height:80px;}
.label{
  display:block;font-size:.78rem;font-weight:700;
  color:var(--warm-lt);margin-bottom:5px;
}
.field{margin-bottom:12px;}

/* Tags */
.tag{
  display:inline-block;padding:3px 10px;border-radius:20px;
  font-size:.72rem;font-weight:700;
}
.tag-g{background:#D6EDD7;color:#2D6B30;}
.tag-y{background:#FDF0C0;color:#7A5800;}
.tag-r{background:#FBDADA;color:#9B2222;}
.tag-b{background:#D4E9F5;color:#1A5C80;}
.tag-gr{background:#EBEBEB;color:#555;}
.tag-p{background:#EDE4F5;color:#5A3580;}

/* Chips */
.chip{
  display:inline-flex;align-items:center;
  padding:6px 13px;border-radius:20px;
  border:1.5px solid var(--border);
  cursor:pointer;font-size:.78rem;font-weight:600;
  color:var(--text-lt);background:white;
  transition:all .15s;margin:3px;
  -webkit-tap-highlight-color:transparent;
}
.chip.sel{background:var(--rose);color:white;border-color:var(--rose);}

/* Progress */
.pbar-wrap{background:var(--warm-pale);border-radius:20px;height:7px;overflow:hidden;}
.pbar{height:100%;border-radius:20px;
  background:linear-gradient(90deg,var(--rose),var(--peach));
  transition:width .5s ease;}

/* Section Header */
.sect-hd{
  font-size:.68rem;font-weight:800;
  color:var(--warm-lt);letter-spacing:.08em;
  text-transform:uppercase;margin:18px 0 8px;
}

/* ─── OVERLAYS ──────────────────────────────────────────────────── */
.overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(61,43,31,.5);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;
  padding:0;
  animation:fadeIn .2s ease;
}
.overlay.centered{align-items:center;padding:16px;}
.sheet{
  background:white;
  border-radius:24px 24px 0 0;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom));
  width:100%;
  max-height:92dvh;
  overflow-y:auto;
  animation:slideUp .3s cubic-bezier(.34,1.2,.64,1);
}
.sheet.modal-sheet{
  border-radius:24px;
  max-height:88dvh;
  width:100%;
  max-width:520px;
  margin:auto;
  animation:scaleIn .25s ease;
}
.sheet-handle{
  width:40px;height:4px;
  background:var(--warm-pale);border-radius:4px;
  margin:0 auto 18px;
}

/* ─── PAGE TRANSITIONS ──────────────────────────────────────────── */
.page{animation:fadeUp .25s ease both;}

/* ─── DASHBOARD ─────────────────────────────────────────────────── */
.dash-hero{
  background:linear-gradient(135deg,#FBE9DC 0%,#F2D5C5 50%,#EDD8D0 100%);
  border-radius:20px;
  padding:20px;
  margin-bottom:14px;
  position:relative;
  overflow:hidden;
}
.dash-hero::after{
  content:'🌿';
  position:absolute;right:-10px;top:-10px;
  font-size:5rem;opacity:.12;
  transform:rotate(20deg);
}
.dash-hero h2{font-size:1.4rem;color:var(--warm);margin-bottom:4px;}
.dash-hero p{font-size:.82rem;color:var(--warm-lt);}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.stat-box{
  background:white;border-radius:14px;padding:12px 10px;
  text-align:center;box-shadow:var(--sh1);border:1px solid var(--border);
}
.stat-val{font-size:1.5rem;font-weight:800;color:var(--rose);}
.stat-lbl{font-size:.65rem;color:var(--text-lt);font-weight:600;margin-top:2px;}

.quick-ref{
  background:linear-gradient(135deg,#EDF5EE,#D8EDD9);
  border-radius:14px;padding:14px;margin-bottom:10px;
}

/* ─── FOOD LIST ─────────────────────────────────────────────────── */
.food-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:9px;
}
.food-card{
  background:var(--cream);
  border-radius:13px;padding:12px;
  border:1.5px solid var(--border);
  cursor:pointer;
  transition:border-color .2s,box-shadow .2s;
}
.food-card:active{border-color:var(--rose);box-shadow:0 3px 12px rgba(232,146,124,.2);}

/* ─── CHAT ──────────────────────────────────────────────────────── */
.chat-area{
  display:flex;flex-direction:column;gap:10px;
  max-height:55dvh;overflow-y:auto;
  padding:4px 2px;
}
.msg{display:flex;gap:8px;align-items:flex-start;animation:fadeUp .25s ease;}
.msg.user{flex-direction:row-reverse;}
.bubble{
  max-width:78%;padding:10px 14px;border-radius:18px;
  font-size:.85rem;line-height:1.55;white-space:pre-wrap;
}
.msg.ai .bubble{
  background:var(--cream);border:1px solid var(--border);
  color:var(--text);border-radius:4px 18px 18px 18px;
}
.msg.user .bubble{
  background:linear-gradient(135deg,var(--rose),var(--peach));
  color:white;border-radius:18px 4px 18px 18px;
}
.avatar{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;flex-shrink:0;
}
.msg.ai .avatar{background:var(--peach);}
.msg.user .avatar{background:var(--sage-lt);}
.chat-input-row{display:flex;gap:8px;margin-top:10px;align-items:flex-end;}
.chat-input-row .input{flex:1;}

/* ─── WEEK GRID ─────────────────────────────────────────────────── */
.week-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
.week-grid{
  display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));
  gap:8px;min-width:800px;
}
.day-col{
  background:var(--cream);border-radius:12px;
  padding:9px 8px;border:1px solid var(--border);
}
.day-lbl{
  font-size:.68rem;font-weight:800;text-align:center;
  color:var(--warm-lt);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.06em;
}
.meal-slot{
  background:white;border-radius:8px;
  padding:7px;margin-bottom:4px;
  font-size:.7rem;border:1px solid var(--border);
  cursor:pointer;transition:all .15s;
  min-height:44px;
}
.meal-slot:active{border-color:var(--rose);}
.meal-slot.filled{
  background:linear-gradient(135deg,#FFF0E8,#FFE4D4);
  border-color:var(--peach);
}
.meal-slot .mtype{
  font-size:.6rem;color:var(--warm-lt);
  font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;margin-bottom:2px;
}

/* ─── CYCLE ─────────────────────────────────────────────────────── */
.cycle-strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0;-webkit-overflow-scrolling:touch;}
.c-phase{
  flex-shrink:0;
  text-align:center;padding:12px 10px;
  border-radius:14px;border:2px solid transparent;
  cursor:pointer;transition:all .2s;
  min-width:78px;
}
.c-phase.active{
  border-color:var(--rose);
  box-shadow:0 3px 12px rgba(232,146,124,.3);
}

/* ─── REPORT ─────────────────────────────────────────────────────── */
.rep-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.rep-box{
  background:var(--cream);border-radius:12px;
  padding:12px;text-align:center;
  border:1px solid var(--border);
}

/* ─── SHOPPING ───────────────────────────────────────────────────── */
.shop-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--border);
}
.shop-item:last-child{border-bottom:none;}
.shop-item.done span{text-decoration:line-through;color:var(--text-lt);}

/* ─── TAGESCHECK ─────────────────────────────────────────────────── */
.tc-overlay{
  position:fixed;inset:0;z-index:600;
  background:linear-gradient(160deg,rgba(251,233,220,.97),rgba(242,213,197,.97));
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  animation:fadeIn .3s ease;
}
.tc-card{
  background:white;border-radius:28px;
  padding:28px 24px;width:100%;max-width:480px;
  box-shadow:0 20px 60px rgba(61,43,31,.2);
  animation:scaleIn .35s cubic-bezier(.34,1.2,.64,1);
}

/* ─── ANIMATIONS ─────────────────────────────────────────────────── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideUp{
  from{transform:translateY(100%);}
  to{transform:translateY(0);}
}
@keyframes scaleIn{
  from{opacity:0;transform:scale(.92);}
  to{opacity:1;transform:scale(1);}
}

/* ─── SCROLLBAR ──────────────────────────────────────────────────── */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--peach);border-radius:10px;}

/* ─── RANGE INPUT ────────────────────────────────────────────────── */
input[type=range]{
  width:100%;-webkit-appearance:none;appearance:none;
  height:6px;border-radius:10px;
  background:var(--warm-pale);outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:22px;height:22px;border-radius:50%;
  background:var(--rose);cursor:pointer;
  box-shadow:0 2px 8px rgba(232,146,124,.5);
}
input[type=checkbox]{
  width:18px;height:18px;
  accent-color:var(--sage);cursor:pointer;
  flex-shrink:0;
}

/* ─── UTILS ──────────────────────────────────────────────────────── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.flex{display:flex;gap:8px;}
.flex-c{display:flex;gap:8px;align-items:center;}
.flex-sb{display:flex;justify-content:space-between;align-items:center;}
.mt4{margin-top:4px;} .mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;}
.mb4{margin-bottom:4px;} .mb8{margin-bottom:8px;} .mb12{margin-bottom:12px;}
.fs-xs{font-size:.72rem;} .fs-sm{font-size:.82rem;} .fs-md{font-size:.9rem;}
.fw-7{font-weight:700;} .fw-8{font-weight:800;}
.c-warm{color:var(--warm);} .c-lt{color:var(--text-lt);} .c-rose{color:var(--rose);}
.ta-c{text-align:center;}
.w100{width:100%;}
.r8{border-radius:8px;}
.hidden{display:none!important;}
</style>

<script>
"use strict";

// ── STORAGE ────────────────────────────────────────────────────────
// ── SPEICHER: IndexedDB (Hauptspeicher) + localStorage (Cache) ──────
// IndexedDB funktioniert auf iOS Safari/Netlify zuverlässig.
// localStorage dient als synchroner schneller Cache beim Start.

const DB_NAME = 'darmglueck_db';
const DB_STORE = 'kv';
let _db = null;
const _cache = {}; // synchroner In-Memory-Cache für sofortigen Zugriff

// IndexedDB öffnen
function _openDB() {
  return new Promise((resolve, reject) => {
    if(_db) { resolve(_db); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(DB_STORE);
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror = () => reject(req.error);
  });
}

// Async speichern in IndexedDB + sofort in localStorage als Backup
async function _idbSet(k, v) {
  // localStorage als sofortiges Backup (falls IDB verzögert)
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {}
  // Primärer Speicher: IndexedDB
  try {
    const db = await _openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(v, k);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  } catch(e) { return false; }
}

// Synchron aus localStorage lesen (für Startup), async aus IDB
function _syncGet(k, d) {
  // Cache hat Priorität
  if(k in _cache) return _cache[k];
  // localStorage als Fallback beim Start
  try {
    const v = localStorage.getItem(k);
    if(v !== null) {
      const parsed = JSON.parse(v);
      _cache[k] = parsed;
      return parsed;
    }
  } catch(e) {}
  return d;
}

// localStorage beim Start mit IDB synchronisieren
async function _syncFromIDB() {
  try {
    const db = await _openDB();
    const tx = db.transaction(DB_STORE, 'readonly');
    const store = tx.objectStore(DB_STORE);
    return new Promise((resolve) => {
      const req = store.getAll();
      const kreq = store.getAllKeys();
      Promise.all([
        new Promise(r => { req.onsuccess = () => r(req.result); req.onerror = () => r([]); }),
        new Promise(r => { kreq.onsuccess = () => r(kreq.result); kreq.onerror = () => r([]); }),
      ]).then(([vals, keys]) => {
        keys.forEach((k, i) => {
          _cache[k] = vals[i];
          try { localStorage.setItem(k, JSON.stringify(vals[i])); } catch(e) {}
        });
        resolve(true);
      });
    });
  } catch(e) { return false; }
}

const S = {
  get: (k, d=[]) => _syncGet(k, d),
  set: (k, v) => { _cache[k] = v; _idbSet(k, v); },
  isTemp: () => false,
};

// App-Version: Key-Migration bei Update
const APP_VERSION = '1.6';
(async () => {
  // Erst IDB→localStorage synchronisieren
  await _syncFromIDB();

  if(_syncGet('dg_appversion','0') !== APP_VERSION) {
    // camelCase → lowercase Migration
    const migrate = {
      'dg_zyklusStart':   'dg_zyklusstart',
      'dg_zyklusLaenge':  'dg_zykluslaenge',
      'dg_letzterCheck':  'dg_letztercheck',

    };
    for(const [oldKey, newKey] of Object.entries(migrate)) {
      const val = _syncGet(oldKey, null);
      if(val !== null) {
        S.set(newKey, val);
        try { localStorage.removeItem(oldKey); } catch(e) {}
      }
    }
    S.set('dg_letztercheck', '');
    S.set('dg_appversion', APP_VERSION);
  }

  // State mit aktuellen (ggf. migrierten) Werten neu laden
  state.mahlzeiten   = S.get('dg_mahlzeiten', []);

  // App starten
  init();
})();

const today = () => new Date().toISOString().split('T')[0];
const fmtDate = d => new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
const tagCls = v => ({'g':'tag-g','y':'tag-y','r':'tag-r'})[v]||'tag-gr';
const tagTxt = v => ({'g':'✅ OK','y':'⚠️ Maßen','r':'❌ Meiden'})[v]||'?';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const allRezepte = () => [...REZEPTE, ...state.eigeneRezepte];

// ── SMART REZEPT-FILTER: passt Rezepte zur aktuellen Situation ────
function getSituationScore(rezept) {
  const letzterLog = state.symptomLogs[state.symptomLogs.length-1];
  const todayLog = letzterLog?.datum===today()?letzterLog:null;
  const phase = getCurrentPhase(state.zyklusStart, state.zyklusLaenge);
  const toleranz = state.toleranz;

  let score = 100; // Basis-Score
  let warnings = [];
  let reasons = [];

  // Persönliche Unverträglichkeiten prüfen
  const zutaten = (rezept.zutaten||[]).join(' ').toLowerCase();
  for (const [lm, status] of Object.entries(toleranz)) {
    if (status === 'schlecht') {
      const lmLower = lm.toLowerCase().split(' ')[0]; // Erstes Wort
      if (zutaten.includes(lmLower)) {
        score -= 60;
        warnings.push('⚠️ Enthält ' + lm + ' (du verträgst es nicht)');
      }
    }
  }

  // Aktuelle Beschwerden berücksichtigen
  if (todayLog) {
    const schmerz = todayLog.schmerz ?? 5;
    const reflux = todayLog.reflux ?? 5;
    const sit = rezept.situation || [];

    if (schmerz >= 7) {
      // Starke Bauchschmerzen: Schonkost bevorzugen
      if (sit.includes('akut_schmerz') || sit.includes('schonend')) { score += 30; reasons.push('✅ Schonkost bei akuten Beschwerden'); }
      if (!sit.includes('schonend') && !sit.includes('akut_schmerz')) { score -= 20; }
      if (rezept.tags?.includes('Schonkost')) { score += 25; }
    }
    if (schmerz >= 5 && schmerz < 7) {
      if (sit.includes('schonend')) { score += 15; }
    }

    if (reflux >= 7) {
      // Starker Reflux: nur Reflux-OK Rezepte
      if (rezept.tags?.includes('Reflux-OK')) { score += 25; reasons.push('✅ Reflux-freundlich'); }
      if (sit.includes('reflux_stark')) { score += 20; }
      if (!rezept.tags?.includes('Reflux-OK') && !sit.includes('reflux_stark')) { score -= 30; warnings.push('🔥 Nicht ideal bei Reflux'); }
    }
    if (reflux >= 5 && reflux < 7) {
      if (rezept.tags?.includes('Reflux-OK')) { score += 10; }
      if (sit.includes('reflux_mittel')) { score += 10; }
    }

    const symptome = todayLog.symptome_heute || [];
    if (symptome.includes('Durchfall')) {
      if (sit.includes('durchfall') || rezept.tags?.includes('Durchfall')) { score += 30; reasons.push('✅ Gut bei Durchfall'); }
      if (rezept.tags?.includes('Schonkost')) { score += 20; }
    }
    if (symptome.includes('Verstopfung')) {
      if (sit.includes('verstopfung')) { score += 20; reasons.push('✅ Ballaststoffreich'); }
    }
    if (symptome.includes('Blähungen') || symptome.includes('Bauchkrämpfe')) {
      if (rezept.tags?.includes('Wärmend') || sit.includes('warm_beruhigend')) { score += 15; }
    }

    // Gestern schlecht vertragen
    const mahlzeitenGestern = todayLog.mahlzeiten_gestern ?? 5;
    if (mahlzeitenGestern <= 2) {
      if (sit.includes('mahlzeit_schlecht') || rezept.tags?.includes('Schonkost')) { score += 25; reasons.push('✅ Schonend nach schlechtem Tag'); }
    }
  }

  // Zyklusphase berücksichtigen
  if (phase) {
    const rZyklus = rezept.zyklus || rezept.zyklusPhase || ['alle'];
    if (rZyklus.includes('alle') || rZyklus.includes(phase.id)) {
      score += 20;
      reasons.push('✅ Passt zur ' + phase.name);
    } else {
      score -= 10;
    }
  }

  // Tageszeit / Mahlzeittyp wird beim Anzeigen gefiltert
  return { score, warnings, reasons };
}

function getRezepteForSituation(kat) {
  const alle = allRezepte();
  return alle
    .filter(r => !kat || (r.kat||r.kategorie) === kat)
    .map(r => ({ ...r, _score: getSituationScore(r) }))
    .sort((a, b) => b._score.score - a._score.score);
}

// Toleranz-Hilfsfunktionen
function setToleranz(name, status) {
  const updated = { ...state.toleranz, [name]: status };
  save('toleranz', updated);
}
function getToleranzBadge(name) {
  const t = state.toleranz[name];
  if (t === 'gut') return '<span style="background:#D6EDD7;color:#2D6B30;padding:2px 8px;border-radius:12px;font-size:.68rem;font-weight:700">😊 Vertrage ich</span>';
  if (t === 'schlecht') return '<span style="background:#FBDADA;color:#9B2222;padding:2px 8px;border-radius:12px;font-size:.68rem;font-weight:700">😣 Vertrage ich nicht</span>';
  if (t === 'testen') return '<span style="background:#FDF0C0;color:#7A5800;padding:2px 8px;border-radius:12px;font-size:.68rem;font-weight:700">🧪 Teste noch</span>';
  return '';
}

function getCurrentPhase(start, len) {
  if (!start) return null;
  const diff = Math.floor((new Date()-new Date(start))/(86400000));
  const tag = ((diff % len) + len) % len + 1;
  if (tag<=5) return {...CYCLE_PHASES[0], tagNr:tag};
  if (tag<=13) return {...CYCLE_PHASES[1], tagNr:tag};
  if (tag===14) return {...CYCLE_PHASES[2], tagNr:tag};
  return {...CYCLE_PHASES[3], tagNr:tag};
}

let tcStep = 0; let tcData = {};
function openTagescheck() {
  tcStep=0; tcData={};
  // Sicherstellen dass body bereit ist
  if(document.body) {
    renderTCStep();
  } else {
    document.addEventListener('DOMContentLoaded', ()=>renderTCStep());
  }
}

function renderTCStep() {
  const existing = document.getElementById('tc-overlay');
  if (existing) existing.remove();

  const q = TC_FRAGEN[tcStep];
  const total = TC_FRAGEN.length;
  const pct = Math.round(((tcStep+1)/total)*100);
  const val = tcData[q.id] !== undefined ? tcData[q.id] : 5;

  let inputHtml = '';
  if (q.typ==='skala') {
    inputHtml=`
      <input type="range" min="0" max="10" value="${val}" id="tc-range" oninput="document.getElementById('tc-rv').textContent=this.value">
      <div class="flex-sb mt8 fs-xs c-lt">
        <span>${q.lmin}</span>
        <span class="fw-8 c-rose" id="tc-rv">${val}</span>
        <span>${q.lmax}</span>
      </div>`;
  } else if (q.typ==='ynu') {
    inputHtml=`<div class="flex" style="gap:10px">${['Ja','Nein','Unsicher'].map(o=>`
      <button class="btn ${tcData[q.id]===o?'btn-primary':'btn-secondary'}" onclick="tcData['${q.id}']='${o}';renderTCStep()">${o}</button>`).join('')}
    </div>`;
  } else if (q.typ==='chips') {
    const sel = tcData[q.id]||[];
    inputHtml=`<div style="max-height:160px;overflow-y:auto">${SYMPTOME.map(s=>`
      <span class="chip${sel.includes(s)?' sel':''}" onclick="tcToggleChip('${s}')">${s}</span>`).join('')}
    </div>`;
  }

  const div = document.createElement('div');
  div.id='tc-overlay'; div.className='tc-overlay';
  div.innerHTML=`
    <div class="tc-card">
      <div class="flex-sb mb12">
        <span class="fs-xs fw-7 c-lt">Tagescheck · ${tcStep+1} / ${total}</span>
        <button onclick="closeTagescheck()" style="background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--text-lt)">✕</button>
      </div>
      <div class="pbar-wrap mb12"><div class="pbar" style="width:${pct}%"></div></div>
      <h3 style="font-size:1.1rem;margin-bottom:18px;color:var(--warm)">${q.text}</h3>
      ${inputHtml}
      <button class="btn btn-primary btn-full mt16" onclick="tcNext()" style="margin-top:20px">
        ${tcStep<total-1?'Weiter →':'✅ Tagescheck abschließen'}
      </button>
    </div>`;
  document.body.appendChild(div);
}

function tcToggleChip(s) {
  const q = TC_FRAGEN[tcStep];
  const cur = tcData[q.id]||[];
  tcData[q.id] = cur.includes(s)?cur.filter(x=>x!==s):[...cur,s];
  renderTCStep();
}

function tcNext() {
  const q = TC_FRAGEN[tcStep];
  if (q.typ==='skala') tcData[q.id]=Number(document.getElementById('tc-range').value);
  if (!tcData[q.id] && q.typ!=='chips') tcData[q.id]=5;
  if (tcStep < TC_FRAGEN.length-1) { tcStep++; renderTCStep(); }
  else {
    const log = {...tcData, datum:today()};
    save('symptomLogs',[...state.symptomLogs, log]);
    save('letzterCheck', today());
    closeTagescheck();
    navigate(state.page);
  }
}

function closeTagescheck() {
  const el=document.getElementById('tc-overlay');
  if(el)el.remove();
}

      <div class="fw-7" style="color:#7A5800;margin-bottom:4px">🧪 Teste noch:</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">
        ${Object.entries(state.toleranz).filter(([k,v])=>v==='testen').map(([k])=>`<span style="background:#FDF0C0;color:#7A5800;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:600">${esc(k)}</span>`).join('')}
      </div>
    </div>`:''}`:
    '<p class="fs-xs c-lt mb12">💡 Tippe ein Lebensmittel an und markiere deine Verträglichkeit – die Rezepte passen sich dann automatisch an!</p>'}

    <div class="card" style="padding:14px">
      <input class="input mb8" placeholder="🔍 Suchen..." id="lm-suche" value="${esc(lmSuche)}" oninput="lmSuche=this.value;document.getElementById('lm-grid').innerHTML=getLmGrid()">
      <div class="g2">
        <select class="select" id="lm-kat" onchange="lmKat=this.value;document.getElementById('lm-grid').innerHTML=getLmGrid()">
          ${kats.map(k=>`<option${lmKat===k?' selected':''}>${k}</option>`).join('')}
        </select>
        <select class="select" id="lm-filt" onchange="lmFilter=this.value;document.getElementById('lm-grid').innerHTML=getLmGrid()">
          <option value="Alle"${lmFilter==='Alle'?' selected':''}>Alle FODMAP</option>
          <option value="g"${lmFilter==='g'?' selected':''}>✅ Erlaubt</option>
          <option value="y"${lmFilter==='y'?' selected':''}>⚠️ In Maßen</option>
          <option value="r"${lmFilter==='r'?' selected':''}>❌ Meiden</option>
        </select>
        <select class="select" style="width:160px" onchange="lmToleranzFilter=this.value;document.getElementById('lm-grid').innerHTML=getLmGrid()">
          <option value="alle">Alle Vertr.</option>
          <option value="gut">😊 Vertrage ich</option>
          <option value="schlecht">😣 Vertrage nicht</option>
          <option value="testen">🧪 Teste noch</option>
          <option value="unbewertet">Noch nicht bewertet</option>
        </select>
      </div>
      <div class="flex-c mt8 fs-xs c-lt" style="gap:14px;flex-wrap:wrap">
        <span>✅ Low-FODMAP/OK</span><span>⚠️ Kleine Menge</span><span>❌ Meiden</span>
        <span style="font-weight:700">F=FODMAP · R=Reflux</span>
      </div>
    </div>

    <div id="lm-grid">${getLmGrid()}</div>
  `;
}

function getLmGrid() {
  const items=LEBENSMITTEL.filter(l=>{
    const ms=l.name.toLowerCase().includes(lmSuche.toLowerCase());
    const mk=lmKat==='Alle'||l.kat===lmKat;
    const mf=lmFilter==='Alle'||l.f===lmFilter;
    const tol=state.toleranz[l.name];
    const mt=lmToleranzFilter==='alle'||
      (lmToleranzFilter==='gut'&&tol==='gut')||
      (lmToleranzFilter==='schlecht'&&tol==='schlecht')||
      (lmToleranzFilter==='testen'&&tol==='testen')||
      (lmToleranzFilter==='unbewertet'&&!tol);
    return ms&&mk&&mf&&mt;
  });
  if(!items.length) return '<p class="ta-c c-lt" style="padding:24px 0">Keine Treffer</p>';
  return `<div class="food-grid">${items.map(l=>`
    <div class="food-card" onclick="showLmDetail(${JSON.stringify(l).replace(/"/g,'&quot;')})"
      style="${state.toleranz[l.name]==='schlecht'?'border-color:#D97474;background:#FFF5F5':''}${state.toleranz[l.name]==='gut'?'border-color:#8BAF8D;background:#F5FFF5':''}${state.toleranz[l.name]==='testen'?'border-color:#F5C842;':''}">
      <div style="font-size:1.5rem;margin-bottom:4px">${l.e}</div>
      <div class="fw-7 fs-sm mb4">${esc(l.name)}</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap">
        <span class="tag ${tagCls(l.f)}" style="font-size:.62rem">F: ${tagTxt(l.f)}</span>
        <span class="tag ${tagCls(l.r)}" style="font-size:.62rem">R: ${tagTxt(l.r)}</span>
        ${state.toleranz[l.name]==='gut'?'<span title="Vertrage ich" style="font-size:.75rem">😊</span>':''}
        ${state.toleranz[l.name]==='schlecht'?'<span title="Vertrage ich nicht" style="font-size:.75rem">😣</span>':''}
        ${state.toleranz[l.name]==='testen'?'<span title="Teste noch" style="font-size:.75rem">🧪</span>':''}
      </div>
    </div>`).join('')}</div>`;
}

function showLmDetail(l) {
  const existing = document.getElementById('lm-overlay');
  if(existing) existing.remove();

  const tol = state.toleranz[l.name];
  const safeId = 'lm_' + l.name.replace(/[^a-zA-Z0-9]/g,'_');

  // Build toleranz buttons via DOM to avoid quote conflicts
  const el = document.createElement('div');
  el.className = 'overlay centered';
  el.id = 'lm-overlay';
  el.onclick = e => { if(e.target===el) el.remove(); };

  // Info badges HTML (safe strings)
  let infoBadges = '';
  if(l.f==='r') infoBadges += '<span class="tag tag-r">⚠️ High-FODMAP</span> ';
  if(l.f==='y') infoBadges += '<span class="tag tag-y">⚠️ Portionsgröße beachten</span> ';
  if(l.r==='r') infoBadges += '<span style="background:#FFE8D0;color:#9B3B00;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700">🔥 Reflux-Trigger</span> ';
  if(l.f==='g' && l.r==='g') infoBadges += '<span class="tag tag-g">✅ Doppelt grün – ideal!</span>';

  // Toleranz warning box
  let tolBox = '';
  if(tol==='schlecht') tolBox = '<div class="fs-xs" style="margin-top:8px;color:#9B2222;background:#FBDADA;padding:6px 10px;border-radius:8px">Rezepte mit diesem Lebensmittel werden im Kochbuch als ungeeignet markiert.</div>';

  el.innerHTML = `
    <div class="sheet modal-sheet" id="${safeId}_sheet">
      <div class="ta-c" style="margin-bottom:14px">
        <div style="font-size:3rem">${l.e}</div>
        <h2 class="c-warm" style="font-size:1.25rem">${esc(l.name)}</h2>
        <span class="tag tag-gr">${l.kat}</span>
      </div>
      <div class="g2 mb12">
        <div style="background:var(--cream);border-radius:12px;padding:12px;text-align:center">
          <div class="fs-xs fw-7 c-lt mb4">FODMAP</div>
          <span class="tag ${tagCls(l.f)}">${tagTxt(l.f)}</span>
        </div>
        <div style="background:var(--cream);border-radius:12px;padding:12px;text-align:center">
          <div class="fs-xs fw-7 c-lt mb4">Reflux</div>
          <span class="tag ${tagCls(l.r)}">${tagTxt(l.r)}</span>
        </div>
      </div>
      <div style="margin-bottom:14px">
        ${l.info ? '<p class="fs-sm" style="line-height:1.65;color:var(--text);margin-bottom:8px">' + esc(l.info) + '</p>' : ''}
        <div style="display:flex;flex-wrap:wrap;gap:5px">${infoBadges}</div>
      </div>
      <div style="background:var(--cream);border-radius:14px;padding:14px;margin-bottom:14px">
        <div class="fs-xs fw-7 c-lt mb8">🙋 Meine persönliche Verträglichkeit</div>
        <div id="${safeId}_tolBtns" style="display:flex;gap:6px;flex-wrap:wrap"></div>
        <div id="${safeId}_tolMsg">${tolBox}</div>
        <div id="${safeId}_tolReset"></div>
      </div>
      <button class="btn btn-primary btn-full" onclick="document.getElementById('lm-overlay').remove()">Schließen</button>
    </div>`;

  document.body.appendChild(el);

  // Build toleranz buttons via DOM (avoids all quote issues)
  const btnsEl = document.getElementById(safeId + '_tolBtns');
  const resetEl = document.getElementById(safeId + '_tolReset');

  const tolOptions = [
    { status:'gut',      label:'😊 Vertrage ich',   bg:tol==='gut'?'#D6EDD7':'white', border:tol==='gut'?'#2D6B30':'var(--border)', color:tol==='gut'?'#2D6B30':'var(--text-lt)' },
    { status:'testen',   label:'🧪 Teste noch',      bg:tol==='testen'?'#FDF0C0':'white', border:tol==='testen'?'#7A5800':'var(--border)', color:tol==='testen'?'#7A5800':'var(--text-lt)' },
    { status:'schlecht', label:'😣 Vertrage nicht',  bg:tol==='schlecht'?'#FBDADA':'white', border:tol==='schlecht'?'#9B2222':'var(--border)', color:tol==='schlecht'?'#9B2222':'var(--text-lt)' },
  ];

  tolOptions.forEach(opt => {
    const btn = document.createElement('button');
    btn.textContent = opt.label;
    btn.style.cssText = 'flex:1;min-width:80px;padding:8px 6px;border-radius:10px;border:2px solid ' + opt.border + ';background:' + opt.bg + ';cursor:pointer;font-size:.78rem;font-weight:700;color:' + opt.color;
    btn.onclick = () => setToleranzAndRefresh(l.name, opt.status);
    btnsEl.appendChild(btn);
  });

  if(tol) {
    const resetBtn = document.createElement('button');
    resetBtn.textContent = 'Markierung entfernen';
    resetBtn.style.cssText = 'margin-top:8px;background:none;border:none;cursor:pointer;font-size:.72rem;color:var(--text-lt);text-decoration:underline';
    resetBtn.onclick = () => setToleranzAndRefresh(l.name, null);
    resetEl.appendChild(resetBtn);
  }
}

function setToleranzAndRefresh(name, status) {
  if(status === null) {
    const updated = {...state.toleranz};
    delete updated[name];
    save('toleranz', updated);
  } else {
    setToleranz(name, status);
  }
  const lm = LEBENSMITTEL.find(l => l.name === name);
  if(lm) { document.getElementById('lm-overlay')?.remove(); showLmDetail(lm); }
  const grid = document.getElementById('lm-grid');
  if(grid) grid.innerHTML = getLmGrid();
}

function saveMahlzeit() {
  const name=document.getElementById('trkName')?.value||trkForm.name;
  if(!name.trim()){alert('Bitte Name eingeben');return;}
  const m={...trkForm,name,emoji:document.getElementById('trkEmoji')?.value||trkForm.emoji,id:Date.now()};
  save('mahlzeiten',[...state.mahlzeiten,m]);
  trkForm={name:'',typ:'Frühstück',fodmap:'g',reflux:'g',emoji:'🍽️',notiz:'',bew:0,datum:today()};
  trkFormOpen=false;
  renderPage();
}

function deleteMahlzeit(id) {
  save('mahlzeiten',state.mahlzeiten.filter(m=>m.id!==id));
  renderPage();
}

let kbSuche=''; let kbKat='Alle'; let kbNeuOpen=false; let kbFilter='alle'; let kbZyklus='alle';
let kbNeu={name:'',emoji:'🍽️',kat:'Mittagessen',min:30,level:'Einfach',zutaten:'',zub:'',tags:''};

function renderKochbuch() {
  const rezepte=allRezepte();

    const ms=r.name.toLowerCase().includes(kbSuche.toLowerCase())||r.tags?.some(t=>t.toLowerCase().includes(kbSuche.toLowerCase()));

      <div class="field"><label class="label">Zubereitung</label><textarea class="textarea" rows="4" oninput="kbNeu.zub=this.value">${esc(kbNeu.zub)}</textarea></div>
      <div class="field"><label class="label">Tags (kommagetrennt)</label><input class="input" placeholder="Low-FODMAP, Glutenfrei, Schnell" oninput="kbNeu.tags=this.value" value="${esc(kbNeu.tags)}"></div>
      <div class="flex">
        <button class="btn btn-primary" onclick="saveEigenesRezept()">✅ Speichern</button>
        <button class="btn btn-secondary" onclick="kbNeuOpen=false;renderPage()">Abbrechen</button>
      </div>
    </div>`:''}

    <div id="kb-grid">${getKbGrid()}</div>
  `;
}

function getKbGrid() {
  const rezepte = getRezepteForSituation(kbKat==='Alle'?null:kbKat);
  const lm_schlecht = Object.entries(state.toleranz).filter(([k,v])=>v==='schlecht').map(([k])=>k.toLowerCase().split(' ')[0]);

  const filtered = rezepte.filter(r=>{
    // Suchtext
    const ms = r.name.toLowerCase().includes(kbSuche.toLowerCase()) ||
               (r.tags||[]).some(t=>t.toLowerCase().includes(kbSuche.toLowerCase()));
    if(!ms) return false;

    // Schnellfilter
    if(kbFilter==='ideal')       return (r._score?.score||0) >= 90;
    if(kbFilter==='vertraeglich') return !lm_schlecht.some(lm=>(r.zutaten||[]).some(z=>z.toLowerCase().includes(lm)));
    if(kbFilter==='schonkost')   return (r.tags||[]).some(t=>t==='Schonkost'||t==='Reflux-OK');

    // Zyklusfilter
    if(kbZyklus !== 'alle') {
      const rz = r.zyklus || r.zyklusPhase || ['alle'];
      if(!rz.includes('alle') && !rz.includes(kbZyklus)) return false;
    }

    return true;
  });

  if(!filtered.length) return '<p class="c-lt ta-c" style="padding:28px 0">Keine Rezepte gefunden 🔍<br><span class="fs-xs">Filter anpassen oder Suche leeren</span></p>';

  // Wenn Zyklusfilter aktiv oder kbFilter !== 'alle': alles flach anzeigen (kein "Ideal"-Grouping)
  const useGrouping = !kbSuche && kbFilter==='alle' && kbZyklus==='alle';

  if(useGrouping) {
    const top  = filtered.filter(r=>(r._score?.score||0) >= 90);
    const rest = filtered.filter(r=>(r._score?.score||0) < 90);
    let html = '';
    if(top.length) {
      html += `<div class="sect-hd" style="display:flex;align-items:center;gap:6px">✨ Ideal für jetzt <span style="font-size:.63rem;color:var(--text-lt);font-weight:400">(Zustand + Zyklus + Verträglichkeit)</span></div>`;
      html += top.slice(0,6).map(r=>rezeptCard(r)).join('');
      if(rest.length) html += `<div class="sect-hd mt12">Alle Rezepte (${rest.length})</div>`;
    }
    html += rest.map(r=>rezeptCard(r)).join('');
    return html;
  }

  // Flache Anzeige mit Anzahl
  const label = kbZyklus !== 'alle'
    ? ({menstruation:'🌕 Periode',follikel:'🌱 Follikelphase',ovulation:'🌸 Eisprung',luteal:'🍂 Lutealphase'})[kbZyklus]
    : kbFilter !== 'alle' ? ({ideal:'✨ Ideal jetzt',vertraeglich:'😊 Verträglich',schonkost:'🌿 Schonkost'})[kbFilter] : '';
  let html = '';
  if(label) html += `<div class="sect-hd">${label} · ${filtered.length} Rezepte</div>`;
  html += filtered.map(r=>rezeptCard(r)).join('');
  return html;
}

function rezeptCard(r) {
  const score = r._score || {score:100,warnings:[],reasons:[]};
  const hasWarning = score.warnings.length > 0;
  const isIdeal = score.score >= 90;
  const lm_schlecht = Object.entries(state.toleranz).filter(([k,v])=>v==='schlecht').map(([k])=>k.toLowerCase().split(' ')[0]);
  const hatUnvertraegliches = (r.zutaten||[]).some(z=>lm_schlecht.some(lm=>z.toLowerCase().includes(lm)));

  return `
    <div class="card" style="cursor:pointer;${hatUnvertraegliches?'border-color:#D97474;opacity:.7':''}${isIdeal&&!hatUnvertraegliches?'border-color:var(--sage);':''}${score.score<60?'opacity:.65':''}" onclick="${hatUnvertraegliches?'showUnvertraeglichWarnung('+r.id+')':'showRezeptDetail('+r.id+')'}">
      <div class="flex-sb">
        <div class="flex-c">
          <span style="font-size:1.8rem">${r.e||r.emoji}</span>
          <div style="flex:1">
            <div class="fw-7 fs-md c-warm">${esc(r.name)}</div>
            <div class="fs-xs c-lt">⏱ ${r.min||r.dauer} Min · ${r.level||r.schwierigkeit} · ${r.kat||r.kategorie}</div>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
          ${isIdeal&&!hatUnvertraegliches?'<span style="font-size:.72rem;background:#D6EDD7;color:#2D6B30;padding:2px 7px;border-radius:10px;font-weight:700">✨ Ideal</span>':''}
          ${hatUnvertraegliches?'<span style="font-size:.72rem;background:#FBDADA;color:#9B2222;padding:2px 7px;border-radius:10px;font-weight:700">😣 Unverträglich</span>':''}
          <span style="font-size:1.1rem;color:var(--warm-lt)">›</span>
        </div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px">
        ${(r.tags||[]).slice(0,3).map(t=>`<span class="tag tag-b" style="font-size:.65rem">${t}</span>`).join('')}
        ${score.reasons.slice(0,1).map(r2=>`<span style="background:#EDF5EE;color:#2D6B30;padding:2px 8px;border-radius:10px;font-size:.65rem">${r2}</span>`).join('')}
        ${state.eigeneRezepte.find(e=>e.id===r.id)?'<span class="tag tag-g" style="font-size:.65rem">Eigenes</span>':''}
      </div>
    </div>`;
}

function showUnvertraeglichWarnung(id) {

  if(!r) return;
  const lm_schlecht = Object.entries(state.toleranz).filter(([k,v])=>v==='schlecht').map(([k])=>k);
  const betroffene = (r.zutaten||[]).filter(z=>lm_schlecht.some(lm=>z.toLowerCase().includes(lm.toLowerCase().split(' ')[0])));
  if(confirm('⚠️ Dieses Rezept enthält Zutaten die du nicht verträgst:\n\n' + betroffene.join('\n') + '\n\nTrotzdem anzeigen?')) {

function setWPMeal(tag,typ,id) {
  const r=id?allRezepte().find(x=>x.id===id):null;
  const updated={...state.wochenplan};
  if(r)updated[`${tag}_${typ}`]=r;
  else delete updated[`${tag}_${typ}`];
  save('wochenplan',updated);
  document.getElementById('wp-sheet')?.remove();
  renderPage();
}

function generatePlan() {
  const plan={};
  const lm_schlecht = Object.entries(state.toleranz).filter(([k,v])=>v==='schlecht').map(([k])=>k.toLowerCase().split(' ')[0]);

  WD.forEach(tag=>{
    MT.forEach(typ=>{
      // Nutze smart scoring
      const scored = getRezepteForSituation(typ)
        .filter(r=>{
          // Keine unverträglichen Zutaten
          const hatUnv = lm_schlecht.length > 0 && (r.zutaten||[]).some(z=>lm_schlecht.some(lm=>z.toLowerCase().includes(lm)));
          return !hatUnv;
        });
      if(!scored.length) return;
      // Top 5 nehmen, zufällig einen wählen (verhindert Wiederholungen)
      const top = scored.slice(0,Math.min(8,scored.length));
      plan[tag+'_'+typ]=top[Math.floor(Math.random()*top.length)];
    });
  });
  save('wochenplan',plan);
  renderPage();
}

function generateShoppingList() {
  const alle=[];
  Object.values(state.wochenplan).forEach(r=>{if(r?.zutaten)alle.push(...r.zutaten);});
  const einzig=[...new Set(alle)];
  save('einkaufsliste',einzig.map(z=>({text:z,done:false,id:Date.now()+Math.random()})));
}

function toggleShopItem(id) {
  save('einkaufsliste',state.einkaufsliste.map(i=>i.id==id?{...i,done:!i.done}:i));
  renderPage();
}

async function sendChat() {
  const input=document.getElementById('ci');
  const text=input?.value?.trim();
  if(!text||chatLoading)return;

  const letzterLog=state.symptomLogs[state.symptomLogs.length-1];
  const heutigeMeals=state.mahlzeiten.filter(m=>m.datum===today());
  const phase=getCurrentPhase(state.zyklusStart,state.zyklusLaenge);

  const systemPrompt=`Du bist eine einfühlsame, erfahrene Ernährungsberaterin für:
- Reizdarmsyndrom (Low-FODMAP, Langzeiternährung – weiß was sie verträgt)
- Sodbrennen und saures Aufstoßen  
- Stillen Reflux (Räuspern, Heiserkeit, Kloßgefühl)
- Zyklusabhängige Darmbeschwerden

Aktuell:
${letzterLog?`Letzter Check: Bauch ${letzterLog.schmerz??5}/10, Reflux ${letzterLog.reflux??5}/10, Stimmung ${letzterLog.stimmung??5}/10`:'Kein Check vorhanden'}
${heutigeMeals.length?`Heutige Mahlzeiten: ${heutigeMeals.map(m=>m.name).join(', ')}`:'Noch keine Mahlzeiten heute'}
${phase?`Zyklusphase: ${phase.name} (Tag ${phase.tagNr})`:'Zyklus nicht konfiguriert'}

Regeln:
- Antworte IMMER auf Deutsch
- Warmherzig und empathisch, aber fachlich korrekt
- Erkenne Muster in Text (Text-Mining)
- Stelle bei Unklarheit eine gezielte Rückfrage
- Bei ernsteren Symptomen immer Arztbesuch empfehlen
- Maximal 4-5 Sätze, klar und hilfreich
- Bezug auf FODMAP und Reflux wenn relevant`;

  const userMsg={role:'user',content:text,ts:Date.now()};
  const newHistory=[...state.chatHistory,userMsg];
  save('chatHistory',newHistory);
  input.value='';
  chatLoading=true;
  renderPage();
  document.getElementById('chat-area')?.scrollTo(0,9999);

  try {
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:systemPrompt,
        messages:newHistory.map(m=>({role:m.role,content:m.content}))
      })
    });
    const data=await res.json();
    const reply=data.content?.[0]?.text||'Entschuldigung, es gab einen Fehler.';
    save('chatHistory',[...newHistory,{role:'assistant',content:reply,ts:Date.now()}]);
  } catch(e) {
    save('chatHistory',[...newHistory,{role:'assistant',content:'Verbindungsfehler. Bitte erneut versuchen. 🙏',ts:Date.now()}]);
  }
  chatLoading=false;
  renderPage();
  setTimeout(()=>document.getElementById('chat-area')?.scrollTo(0,9999),100);
}

function exportData() {
  const data = {
    version: '1.4',
    exportDatum: today(),
    mahlzeiten: state.mahlzeiten,
    symptomLogs: state.symptomLogs,
    wochenplan: state.wochenplan,
    einkaufsliste: state.einkaufsliste,
    eigeneRezepte: state.eigeneRezepte,
    zyklusStart: state.zyklusStart,
    zyklusLaenge: state.zyklusLaenge,
    toleranz: state.toleranz,
    letzterCheck: state.letzterCheck,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'darmglueck-backup-' + today() + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if(!data.version) { alert('Ungültige Backup-Datei.'); return; }
      if(data.mahlzeiten)  save('mahlzeiten', data.mahlzeiten);
      if(data.symptomLogs) save('symptomLogs', data.symptomLogs);
      if(data.wochenplan)  save('wochenplan', data.wochenplan);
      if(data.einkaufsliste) save('einkaufsliste', data.einkaufsliste);
      if(data.eigeneRezepte) save('eigeneRezepte', data.eigeneRezepte);
      if(data.zyklusStart !== undefined) save('zyklusStart', data.zyklusStart);
      if(data.zyklusLaenge) save('zyklusLaenge', data.zyklusLaenge);
      if(data.toleranz) save('toleranz', data.toleranz);
      if(data.letzterCheck) save('letzterCheck', data.letzterCheck);
      alert('✅ Daten erfolgreich importiert! (' + (data.mahlzeiten?.length||0) + ' Mahlzeiten, ' + (data.symptomLogs?.length||0) + ' Check-ins)');
      renderPage();
    } catch(err) {
      alert('Fehler beim Importieren: ' + err.message);
    }
  };
  reader.readAsText(file);
}
