<style>
/* ─── DESIGN TOKENS ─────────────────────────────────────────────── */
:root {
  --rose:     #E8927C;
  --rose-dk:  #D4745C;
  --peach:    #F5C5A3;
  --cream:    #FDF6EE;
  --cream-dk: #F7EDE0;
  --sage:     #8BAF8D;
  --sage-lt:  #C8DFC9;
  --warm:     #6B4E3D;
  --warm-lt:  #A47860;
  --warm-pale:#EDD8CA;
  --sky:      #A8C8D8;
  --lav:      #C9B8D8;
  --red:      #D97474;
  --yellow:   #F5E0A0;
  --text:     #3D2B1F;
  --text-lt:  #7A5C4E;
  --border:   #EDD8CA;
  --white:    #FFFFFF;
  --sh1: 0 2px 12px rgba(104,60,40,.10);
  --sh2: 0 6px 28px rgba(104,60,40,.14);
  --r:   16px;
}

/* ─── RESET ────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-tap-highlight-color:transparent;scroll-behavior:smooth;}
body{
  font-family:'Nunito',sans-serif;
  background:var(--cream);
  color:var(--text);
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:'Playfair Display',serif;line-height:1.2;}

/* ─── LAYOUT ────────────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;min-height:100dvh;}

/* TOP BAR */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(253,246,238,.92);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:14px 18px 12px;
  display:flex;align-items:center;gap:12px;
}
.topbar-logo{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--warm);flex:1;}
.topbar-logo span{font-size:.7rem;font-weight:600;color:var(--warm-lt);display:block;letter-spacing:.03em;}
.topbar-actions{display:flex;gap:8px;}
.topbar-btn{
  background:none;border:none;cursor:pointer;
  font-size:1.2rem;width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:white;box-shadow:var(--sh1);
  transition:transform .15s;
}
.topbar-btn:hover{transform:scale(1.1);}

/* BOTTOM NAV */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(253,246,238,.95);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:10px 4px 8px;
  border:none;background:none;cursor:pointer;
  font-family:'Nunito',sans-serif;
  font-size:.62rem;font-weight:700;
  color:var(--text-lt);
  transition:color .15s;
  letter-spacing:.02em;
}
.nav-btn .nav-icon{
  font-size:1.35rem;
  transition:transform .2s;
}
.nav-btn.active{color:var(--rose);}
.nav-btn.active .nav-icon{transform:scale(1.18);}

/* MAIN SCROLL */
.main{
  flex:1;
  overflow-y:auto;
  padding:20px 16px 110px;
  -webkit-overflow-scrolling:touch;
}

/* ─── COMPONENTS ────────────────────────────────────────────────── */

/* Cards */
.card{
  background:var(--white);
  border-radius:var(--r);
  box-shadow:var(--sh1);
  padding:18px;
  margin-bottom:14px;
  border:1px solid var(--border);
  animation:fadeUp .3s ease both;
}
.card-title{
  font-family:'Playfair Display',serif;
  font-size:1.05rem;color:var(--warm);
  margin-bottom:12px;
}
.card-sub{font-size:.78rem;color:var(--text-lt);margin-bottom:12px;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:10px 20px;border-radius:30px;border:none;
  cursor:pointer;font-family:'Nunito',sans-serif;
  font-size:.85rem;font-weight:700;
  transition:all .2s;-webkit-tap-highlight-color:transparent;
}
.btn-primary{
  background:linear-gradient(135deg,var(--rose),var(--peach));
  color:white;box-shadow:0 3px 14px rgba(232,146,124,.4);
}
.btn-primary:active{transform:scale(.96);}
.btn-secondary{
  background:var(--white);color:var(--warm);
  border:1.5px solid var(--border);
}
.btn-secondary:active{background:var(--cream-dk);}
.btn-sage{background:var(--sage);color:white;box-shadow:0 3px 10px rgba(139,175,141,.35);}
.btn-sm{padding:7px 14px;font-size:.78rem;}
.btn-xs{padding:5px 10px;font-size:.72rem;}
.btn-full{width:100%;}
.btn-icon{padding:10px;border-radius:50%;}

/* Inputs */
.input,.textarea,.select{
  width:100%;padding:11px 14px;
  border:1.5px solid var(--border);
  border-radius:12px;
  font-family:'Nunito',sans-serif;font-size:.88rem;
  background:var(--cream);color:var(--text);
  outline:none;transition:border-color .2s;
  -webkit-appearance:none;appearance:none;
}
.input:focus,.textarea:focus,.select:focus{border-color:var(--rose);}
.textarea{resize:vertical;min-height:80px;}
.label{
  display:block;font-size:.78rem;font-weight:700;
  color:var(--warm-lt);margin-bottom:5px;
}
.field{margin-bottom:12px;}

/* Tags */
.tag{
  display:inline-block;padding:3px 10px;border-radius:20px;
  font-size:.72rem;font-weight:700;
}
.tag-g{background:#D6EDD7;color:#2D6B30;}
.tag-y{background:#FDF0C0;color:#7A5800;}
.tag-r{background:#FBDADA;color:#9B2222;}
.tag-b{background:#D4E9F5;color:#1A5C80;}
.tag-gr{background:#EBEBEB;color:#555;}
.tag-p{background:#EDE4F5;color:#5A3580;}

/* Chips */
.chip{
  display:inline-flex;align-items:center;
  padding:6px 13px;border-radius:20px;
  border:1.5px solid var(--border);
  cursor:pointer;font-size:.78rem;font-weight:600;
  color:var(--text-lt);background:white;
  transition:all .15s;margin:3px;
  -webkit-tap-highlight-color:transparent;
}
.chip.sel{background:var(--rose);color:white;border-color:var(--rose);}

/* Progress */
.pbar-wrap{background:var(--warm-pale);border-radius:20px;height:7px;overflow:hidden;}
.pbar{height:100%;border-radius:20px;
  background:linear-gradient(90deg,var(--rose),var(--peach));
  transition:width .5s ease;}

/* Section Header */
.sect-hd{
  font-size:.68rem;font-weight:800;
  color:var(--warm-lt);letter-spacing:.08em;
  text-transform:uppercase;margin:18px 0 8px;
}

/* ─── OVERLAYS ──────────────────────────────────────────────────── */
.overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(61,43,31,.5);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;
  padding:0;
  animation:fadeIn .2s ease;
}
.overlay.centered{align-items:center;padding:16px;}
.sheet{
  background:white;
  border-radius:24px 24px 0 0;

<script>
"use strict";

// ── STORAGE ────────────────────────────────────────────────────────
// ── SPEICHER: IndexedDB (Hauptspeicher) + localStorage (Cache) ──────
// IndexedDB funktioniert auf iOS Safari/Netlify zuverlässig.
// localStorage dient als synchroner schneller Cache beim Start.

const DB_NAME = 'darmglueck_db';
const DB_STORE = 'kv';
let _db = null;
const _cache = {}; // synchroner In-Memory-Cache für sofortigen Zugriff

// IndexedDB öffnen
function _openDB() {
  return new Promise((resolve, reject) => {
    if(_db) { resolve(_db); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(DB_STORE);
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror = () => reject(req.error);
  });
}

// Async speichern in IndexedDB + sofort in localStorage als Backup
async function _idbSet(k, v) {
  // localStorage als sofortiges Backup (falls IDB verzögert)
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {}
  // Primärer Speicher: IndexedDB
  try {
    const db = await _openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(v, k);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  } catch(e) { return false; }
}

// Synchron aus localStorage lesen (für Startup), async aus IDB
function _syncGet(k, d) {
  // Cache hat Priorität
  if(k in _cache) return _cache[k];
  // localStorage als Fallback beim Start
  try {
    const v = localStorage.getItem(k);
    if(v !== null) {
      const parsed = JSON.parse(v);
      _cache[k] = parsed;
      return parsed;
    }
  } catch(e) {}
  return d;
}

// localStorage beim Start mit IDB synchronisieren
async function _syncFromIDB() {
  try {
    const db = await _openDB();
    const tx = db.transaction(DB_STORE, 'readonly');
    const store = tx.objectStore(DB_STORE);
    return new Promise((resolve) => {
      const req = store.getAll();
      const kreq = store.getAllKeys();
      Promise.all([
        new Promise(r => { req.onsuccess = () => r(req.result); req.onerror = () => r([]); }),
        new Promise(r => { kreq.onsuccess = () => r(kreq.result); kreq.onerror = () => r([]); }),
      ]).then(([vals, keys]) => {
        keys.forEach((k, i) => {
          _cache[k] = vals[i];
          try { localStorage.setItem(k, JSON.stringify(vals[i])); } catch(e) {}
        });
        resolve(true);
      });
    });
  } catch(e) { return false; }
}

const S = {
  get: (k, d=[]) => _syncGet(k, d),
  set: (k, v) => { _cache[k] = v; _idbSet(k, v); },
  isTemp: () => false,
};

// App-Version: Key-Migration bei Update
const APP_VERSION = '2.0';

// Neuigkeiten pro Version — wird beim Update-Popup angezeigt
const VERSION_NOTES = {
  '2.0': {
    titel: '🌿 Darmglück 2.0 — Große Erweiterung!',
    aenderungen: [
      { emoji:'🥕', titel:'Zutaten-Tracking', text:'Erfasse jetzt die einzelnen Zutaten jeder Mahlzeit — für präzise Analyse welche Lebensmittel Beschwerden auslösen.' },
      { emoji:'📋', titel:'Schnellauswahl gespeicherter Gerichte', text:'Einmal erfasste Gerichte merkt die App automatisch. Beim nächsten Mal einfach antippen — alle Zutaten sind sofort dabei.' },
      { emoji:'📖', titel:'Rezept-Import ins Tracking', text:'Beim Eingeben des Namens erscheinen passende Kochbuch-Rezepte als Vorschlag — Zutaten werden automatisch übernommen.' },
      { emoji:'🔬', titel:'Zutaten-Korrelations-Analyse', text:'Die Analyse zeigt jetzt welche Zutaten häufig an Beschwerde-Tagen dabei waren — auch Low-FODMAP Zutaten die individuell unverträglich sind.' },
      { emoji:'🩺', titel:'Symptome bearbeiten', text:'Erfasste Symptome und Stuhlgang-Einträge können jetzt nachträglich bearbeitet werden — genau wie Mahlzeiten.' },
      { emoji:'💧', titel:'Einkaufsliste verbessert', text:'Zutaten werden jetzt intelligent zusammengeführt und nach Supermarkt-Reihenfolge sortiert.' },
      { emoji:'💾', titel:'Datensicherung immer sichtbar', text:'Export & Import sind jetzt immer im Bericht-Tab sichtbar — unabhängig von der Datenmenge.' },
    ]
  }
};

(async () => {
  // Erst IDB→localStorage synchronisieren
  await _syncFromIDB();

  let showUpdatePopup = false;

  if(_syncGet('dg_appversion','0') !== APP_VERSION) {
    // camelCase → lowercase Migration
    const migrate = {
      'dg_zyklusStart':   'dg_zyklusstart',
      'dg_zyklusLaenge':  'dg_zykluslaenge',
      'dg_letzterCheck':  'dg_letztercheck',
      'dg_symptomLogs':   'dg_symptome',
      'dg_chatHistory':   'dg_chat',
      'dg_eigeneRezepte': 'dg_eigenerezepte',
    };
    for(const [oldKey, newKey] of Object.entries(migrate)) {
      const val = _syncGet(oldKey, null);
      if(val !== null) {
        S.set(newKey, val);
        try { localStorage.removeItem(oldKey); } catch(e) {}
      }
    }
    S.set('dg_letztercheck', '');
    S.set('dg_appversion', APP_VERSION);
    // Popup nur anzeigen wenn es kein erstes Öffnen ist (vorher schon eine Version vorhanden)
    if(_syncGet('dg_appversion','0') !== '0') showUpdatePopup = true;
    showUpdatePopup = true; // Immer zeigen bei Version-Wechsel
  }

  // State mit aktuellen (ggf. migrierten) Werten neu laden
  state.mahlzeiten   = S.get('dg_mahlzeiten', []);
  state.gespeicherteGerichte = S.get('dg_gerichte', []);
  state.symptomLogs  = S.get('dg_symptome', []);
  state.wochenplan   = S.get('dg_wochenplan', {});
  state.einkaufsliste= S.get('dg_einkauf', []);
  state.eigeneRezepte= S.get('dg_eigenerezepte', []);
  state.zyklusStart  = S.get('dg_zyklusstart', '');
  state.zyklusLaenge = S.get('dg_zykluslaenge', 28);
  state.chatHistory  = S.get('dg_chat', []);
  state.letzterCheck = S.get('dg_letztercheck', '');
  state.toleranz     = S.get('dg_toleranz', {});
  state.lesezeichen  = S.get('dg_lesezeichen', []);
  state.stuhlLogs    = S.get('dg_stuhl', []);
  state.symptomZeit  = S.get('dg_symptomzeit', []);

  // App starten
  init();

  // Update-Popup anzeigen (nach kurzem Delay damit die App zuerst rendert)
  if(showUpdatePopup && VERSION_NOTES[APP_VERSION]) {
    setTimeout(() => openUpdatePopup(APP_VERSION), 800);
  }
})();

// ── STATE ───────────────────────────────────────────────────────────
let state = {
  page: 'dashboard',
  mahlzeiten:    S.get('dg_mahlzeiten',[]),
  gespeicherteGerichte: S.get('dg_gerichte',[]),
  symptomLogs:   S.get('dg_symptome',[]),
  stuhlLogs:     S.get('dg_stuhl',[]),
  symptomZeit:   S.get('dg_symptomzeit',[]),
  wochenplan:    S.get('dg_wochenplan',{}),
  einkaufsliste: S.get('dg_einkauf',[]),
  eigeneRezepte: S.get('dg_eigenerezepte',[]),
  zyklusStart:   S.get('dg_zyklusstart',''),
  zyklusLaenge:  S.get('dg_zykluslaenge',28),
  chatHistory:   S.get('dg_chat',[]),
  letzterCheck:  S.get('dg_letztercheck',''),
  tcDaten:       S.get('dg_tcdaten',{}),
  toleranz:      S.get('dg_toleranz',{}),
  lesezeichen:   S.get('dg_lesezeichen',[]),
};

// Alias-Map: state-Key → storage-Key
const KEY_ALIAS = {
  symptomlogs:   'dg_symptome',
  chathistory:   'dg_chat',
  einkaufsliste: 'dg_einkauf',
  stuhllogs:     'dg_stuhl',
  symptomzeit:   'dg_symptomzeit',
  gespeichtegerichte: 'dg_gerichte',
};
const save = (key, val) => {
  state[key] = val;
  const lk = key.toLowerCase();
  const storageKey = KEY_ALIAS[lk] || ('dg_' + lk);
  S.set(storageKey, val);
};

// ── DATA ────────────────────────────────────────────────────────────

// Reizdarmblog 2026, Harvard Health, Cleveland Clinic, NHS, fodmap-info.de
// f = FODMAP: g=grün/OK, y=gelb/Maßen, r=rot/meiden
// r = Reflux: g=grün/OK, y=gelb/Maßen, r=rot/meiden

// ── SMART REZEPT-FILTER: passt Rezepte zur aktuellen Situation ────
function getSituationScore(rezept) {
  const letzterLog = state.symptomLogs[state.symptomLogs.length-1];
  const todayLog = letzterLog?.datum===today()?letzterLog:null;
  const phase = getCurrentPhase(state.zyklusStart, state.zyklusLaenge);
  const toleranz = state.toleranz;

  let score = 50; // Basis-Score (neutral)
  let warnings = [];
  let reasons = [];

  // Persönliche Unverträglichkeiten prüfen
  const zutaten = (rezept.zutaten||[]).join(' ').toLowerCase();
  for (const [lm, status] of Object.entries(toleranz)) {
    if (status === 'schlecht') {
      const lmLower = lm.toLowerCase().split(' ')[0]; // Erstes Wort
      if (zutaten.includes(lmLower)) {
        score -= 60;
        warnings.push('⚠️ Enthält ' + lm + ' (du verträgst es nicht)');
      }
    }
  }

  // Aktuelle Beschwerden berücksichtigen
  if (todayLog) {
    const schmerz = todayLog.schmerz ?? 5;
    const reflux = todayLog.reflux ?? 5;
    const sit = rezept.situation || [];

    if (schmerz >= 7) {
      // Starke Bauchschmerzen: Schonkost bevorzugen
      if (sit.includes('akut_schmerz') || sit.includes('schonend')) { score += 30; reasons.push('✅ Schonkost bei akuten Beschwerden'); }
      if (!sit.includes('schonend') && !sit.includes('akut_schmerz')) { score -= 20; }
      if (rezept.tags?.includes('Schonkost')) { score += 25; }
    }
    if (schmerz >= 5 && schmerz < 7) {
      if (sit.includes('schonend')) { score += 15; }
    }

    if (reflux >= 7) {
      // Starker Reflux: nur Reflux-OK Rezepte
      if (rezept.tags?.includes('Reflux-OK')) { score += 25; reasons.push('✅ Reflux-freundlich'); }
      if (sit.includes('reflux_stark')) { score += 20; }
      if (!rezept.tags?.includes('Reflux-OK') && !sit.includes('reflux_stark')) { score -= 30; warnings.push('🔥 Nicht ideal bei Reflux'); }
    }
    if (reflux >= 5 && reflux < 7) {
      if (rezept.tags?.includes('Reflux-OK')) { score += 10; }
      if (sit.includes('reflux_mittel')) { score += 10; }
    }

    const symptome = todayLog.symptome_heute || [];
    if (symptome.includes('Durchfall')) {
      if (sit.includes('durchfall') || rezept.tags?.includes('Durchfall')) { score += 30; reasons.push('✅ Gut bei Durchfall'); }
      if (rezept.tags?.includes('Schonkost')) { score += 20; }
    }
    if (symptome.includes('Verstopfung')) {
      if (sit.includes('verstopfung')) { score += 20; reasons.push('✅ Ballaststoffreich'); }
    }
    if (symptome.includes('Blähungen') || symptome.includes('Bauchkrämpfe')) {
      if (rezept.tags?.includes('Wärmend') || sit.includes('warm_beruhigend')) { score += 15; }
    }

    // Gestern schlecht vertragen
    const mahlzeitenGestern = todayLog.mahlzeiten_gestern ?? 5;
    if (mahlzeitenGestern <= 2) {
      if (sit.includes('mahlzeit_schlecht') || rezept.tags?.includes('Schonkost')) { score += 25; reasons.push('✅ Schonend nach schlechtem Tag'); }
    }
  }

  // Zyklusphase berücksichtigen
  if (phase) {
    const rZyklus = rezept.zyklus || rezept.zyklusPhase || ['alle'];
    if (rZyklus.includes(phase.id)) {
      // Exakt passend zur aktuellen Phase: großer Bonus
      score += 40;
      reasons.push('✅ Perfekt für ' + phase.name);
    } else if (rZyklus.includes('alle')) {
      // Für alle Phasen geeignet: kleiner Bonus
      score += 10;
    } else {
      // Falsche Phase: Abzug
      score -= 30;
      warnings.push('⚠️ Nicht optimal für ' + phase.name);
    }
  } else {
    // Kein Zyklus konfiguriert: neutrale Basis
    score += 10;
  }

  // Tageszeit / Mahlzeittyp wird beim Anzeigen gefiltert
  return { score, warnings, reasons };
}

function getRezepteForSituation(kat) {
  const alle = allRezepte();
  return alle
    .filter(r => !kat || (r.kat||r.kategorie) === kat)
    .map(r => ({ ...r, _score: getSituationScore(r) }))
    .sort((a, b) => b._score.score - a._score.score);
}

// Toleranz-Hilfsfunktionen
function setToleranz(name, status) {
  const updated = { ...state.toleranz, [name]: status };
  save('toleranz', updated);
}
function getToleranzBadge(name) {
  const t = state.toleranz[name];
  if (t === 'gut') return '<span style="background:#D6EDD7;color:#2D6B30;padding:2px 8px;border-radius:12px;font-size:.68rem;font-weight:700">😊 Vertrage ich</span>';
  if (t === 'schlecht') return '<span style="background:#FBDADA;color:#9B2222;padding:2px 8px;border-radius:12px;font-size:.68rem;font-weight:700">😣 Vertrage ich nicht</span>';
  if (t === 'testen') return '<span style="background:#FDF0C0;color:#7A5800;padding:2px 8px;border-radius:12px;font-size:.68rem;font-weight:700">🧪 Teste noch</span>';
  return '';
}

function getCurrentPhase(start, len) {
  if (!start) return null;
  const diff = Math.floor((new Date()-new Date(start))/(86400000));
  const tag = ((diff % len) + len) % len + 1;
  if (tag<=5) return {...CYCLE_PHASES[0], tagNr:tag};
  if (tag<=13) return {...CYCLE_PHASES[1], tagNr:tag};
  if (tag===14) return {...CYCLE_PHASES[2], tagNr:tag};
  return {...CYCLE_PHASES[3], tagNr:tag};
}

// ── TAGESCHECK ───────────────────────────────────────────────────────
let tcStep = 0; let tcData = {};
function openTagescheck() {
  tcStep=0; tcData={};
  // Sicherstellen dass body bereit ist
  if(document.body) {
    renderTCStep();
  } else {
    document.addEventListener('DOMContentLoaded', ()=>renderTCStep());
  }
}

function renderTCStep() {
  const existing = document.getElementById('tc-overlay');
  if (existing) existing.remove();

  const q = TC_FRAGEN[tcStep];
  const total = TC_FRAGEN.length;
  const pct = Math.round(((tcStep+1)/total)*100);
  const val = tcData[q.id] !== undefined ? tcData[q.id] : 5;

  let inputHtml = '';
  if (q.typ==='skala') {
    inputHtml=`
      <input type="range" min="0" max="10" value="${val}" id="tc-range" oninput="document.getElementById('tc-rv').textContent=this.value">
      <div class="flex-sb mt8 fs-xs c-lt">
        <span>${q.lmin}</span>
        <span class="fw-8 c-rose" id="tc-rv">${val}</span>
        <span>${q.lmax}</span>
      </div>`;
  } else if (q.typ==='ynu') {
    inputHtml=`<div class="flex" style="gap:10px">${['Ja','Nein','Unsicher'].map(o=>`
      <button class="btn ${tcData[q.id]===o?'btn-primary':'btn-secondary'}" onclick="tcData['${q.id}']='${o}';renderTCStep()">${o}</button>`).join('')}
    </div>`;
  } else if (q.typ==='chips') {
    const sel = tcData[q.id]||[];
    inputHtml=`<div style="max-height:160px;overflow-y:auto">${SYMPTOME.map(s=>`
      <span class="chip${sel.includes(s)?' sel':''}" onclick="tcToggleChip('${s}')">${s}</span>`).join('')}
    </div>`;
  }

  const div = document.createElement('div');
  div.id='tc-overlay'; div.className='tc-overlay';
  div.innerHTML=`
    <div class="tc-card">
      <div class="flex-sb mb12">
        <span class="fs-xs fw-7 c-lt">Tagescheck · ${tcStep+1} / ${total}</span>
        <button onclick="closeTagescheck()" style="background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--text-lt)">✕</button>
      </div>
      <div class="pbar-wrap mb12"><div class="pbar" style="width:${pct}%"></div></div>
      <h3 style="font-size:1.1rem;margin-bottom:18px;color:var(--warm)">${q.text}</h3>
      ${inputHtml}
      <button class="btn btn-primary btn-full mt16" onclick="tcNext()" style="margin-top:20px">
        ${tcStep<total-1?'Weiter →':'✅ Tagescheck abschließen'}
      </button>
    </div>`;
  document.body.appendChild(div);
}

function tcToggleChip(s) {
  const q = TC_FRAGEN[tcStep];
  const cur = tcData[q.id]||[];
  tcData[q.id] = cur.includes(s)?cur.filter(x=>x!==s):[...cur,s];
  renderTCStep();
}

function tcNext() {
  const q = TC_FRAGEN[tcStep];
  if (q.typ==='skala') tcData[q.id]=Number(document.getElementById('tc-range').value);
  if (!tcData[q.id] && q.typ!=='chips') tcData[q.id]=5;
  if (tcStep < TC_FRAGEN.length-1) { tcStep++; renderTCStep(); }
  else {
    const log = {...tcData, datum:today()};
    save('symptomLogs',[...state.symptomLogs, log]);
    save('letzterCheck', today());
    closeTagescheck();
    navigate(state.page);
  }
}

function closeTagescheck() {
  const el=document.getElementById('tc-overlay');
  if(el)el.remove();
}

// ── LEBENSMITTEL ──────────────────────────────────────────────────────
let lmSuche=''; let lmKat='Alle'; let lmFilter='Alle'; let lmToleranzFilter='alle';
function renderLebensmittel() {
  const kats=['Alle','Gemüse','Obst','Getreide','Protein','Milch','Fette & Öle','Nüsse & Samen','Getränke','Gewürze','Süßes','Sonstiges'];
  const items=LEBENSMITTEL.filter(l=>{
    const ms=l.name.toLowerCase().includes(lmSuche.toLowerCase());
    const mk=lmKat==='Alle'||l.kat===lmKat;
    const mf=lmFilter==='Alle'||l.f===lmFilter;
    const tol=state.toleranz[l.name];
    const mt=lmToleranzFilter==='alle'||
      (lmToleranzFilter==='gut'&&tol==='gut')||
      (lmToleranzFilter==='schlecht'&&tol==='schlecht')||
      (lmToleranzFilter==='testen'&&tol==='testen')||
      (lmToleranzFilter==='unbewertet'&&!tol);
    return ms&&mk&&mf&&mt;
  });

  const schlechtCount = Object.values(state.toleranz).filter(v=>v==='schlecht').length;
  const gutCount = Object.values(state.toleranz).filter(v=>v==='gut').length;
  return `
    <h1 class="c-warm" style="font-size:1.5rem;margin-bottom:4px">Lebensmittelverzeichnis</h1>
    <p class="fs-xs c-lt mb8">${LEBENSMITTEL.length} Einträge · FODMAP & Reflux-Bewertung</p>
    ${schlechtCount>0||gutCount>0?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center">
      ${gutCount>0?`<span class="tag tag-g" style="font-size:.75rem">😊 ${gutCount} verträgt sie</span>`:''}
      ${schlechtCount>0?`<span class="tag tag-r" style="font-size:.75rem">😣 ${schlechtCount} verträgt sie nicht</span>`:''}
      <span class="fs-xs c-lt">· tippe an zum Bearbeiten</span>
    </div>
    ${schlechtCount>0?`<div style="background:#FFF5F5;border:1px solid #FBDADA;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.78rem">
      <div class="fw-7" style="color:#9B2222;margin-bottom:4px">😣 Nicht verträglich:</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">
        ${Object.entries(state.toleranz).filter(([k,v])=>v==='schlecht').map(([k])=>`<span style="background:#FBDADA;color:#9B2222;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:600">${esc(k)}</span>`).join('')}
      </div>
    </div>`:''}
    ${Object.entries(state.toleranz).filter(([k,v])=>v==='testen').length?`<div style="background:#FFF8E0;border:1px solid #F5E0A0;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.78rem">
      <div class="fw-7" style="color:#7A5800;margin-bottom:4px">🧪 Teste noch:</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">
        ${Object.entries(state.toleranz).filter(([k,v])=>v==='testen').map(([k])=>`<span style="background:#FDF0C0;color:#7A5800;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:600">${esc(k)}</span>`).join('')}
      </div>
    </div>`:''}`:
    '<p class="fs-xs c-lt mb12">💡 Tippe ein Lebensmittel an und markiere deine Verträglichkeit – die Rezepte passen sich dann automatisch an!</p>'}

    <div class="card" style="padding:14px">
      <input class="input mb8" placeholder="🔍 Suchen..." id="lm-suche" value="${esc(lmSuche)}" oninput="lmSuche=this.value;document.getElementById('lm-grid').innerHTML=getLmGrid()">
      <div class="g2">
        <select class="select" id="lm-kat" onchange="lmKat=this.value;document.getElementById('lm-grid').innerHTML=getLmGrid()">
          ${kats.map(k=>`<option${lmKat===k?' selected':''}>${k}</option>`).join('')}
        </select>
        <select class="select" id="lm-filt" onchange="lmFilter=this.value;document.getElementById('lm-grid').innerHTML=getLmGrid()">
          <option value="Alle"${lmFilter==='Alle'?' selected':''}>Alle FODMAP</option>
          <option value="g"${lmFilter==='g'?' selected':''}>✅ Erlaubt</option>
          <option value="y"${lmFilter==='y'?' selected':''}>⚠️ In Maßen</option>
          <option value="r"${lmFilter==='r'?' selected':''}>❌ Meiden</option>
        </select>
        <select class="select" style="width:160px" onchange="lmToleranzFilter=this.value;document.getElementById('lm-grid').innerHTML=getLmGrid()">
          <option value="alle">Alle Vertr.</option>
          <option value="gut">😊 Vertrage ich</option>
          <option value="schlecht">😣 Vertrage nicht</option>
          <option value="testen">🧪 Teste noch</option>
          <option value="unbewertet">Noch nicht bewertet</option>
        </select>
      </div>
      <div class="flex-c mt8 fs-xs c-lt" style="gap:14px;flex-wrap:wrap">
        <span>✅ Low-FODMAP/OK</span><span>⚠️ Kleine Menge</span><span>❌ Meiden</span>
        <span style="font-weight:700">F=FODMAP · R=Reflux</span>
      </div>
    </div>

    <div id="lm-grid">${getLmGrid()}</div>
  `;
}

function getLmGrid() {
  const items=LEBENSMITTEL.filter(l=>{
    const ms=l.name.toLowerCase().includes(lmSuche.toLowerCase());
    const mk=lmKat==='Alle'||l.kat===lmKat;
    const mf=lmFilter==='Alle'||l.f===lmFilter;
    const tol=state.toleranz[l.name];
    const mt=lmToleranzFilter==='alle'||
      (lmToleranzFilter==='gut'&&tol==='gut')||
      (lmToleranzFilter==='schlecht'&&tol==='schlecht')||
      (lmToleranzFilter==='testen'&&tol==='testen')||
      (lmToleranzFilter==='unbewertet'&&!tol);
    return ms&&mk&&mf&&mt;
  });
  if(!items.length) return '<p class="ta-c c-lt" style="padding:24px 0">Keine Treffer</p>';
  return `<div class="food-grid">${items.map(l=>`
    <div class="food-card" onclick="showLmDetail(${JSON.stringify(l).replace(/"/g,'&quot;')})"
      style="${state.toleranz[l.name]==='schlecht'?'border-color:#D97474;background:#FFF5F5':''}${state.toleranz[l.name]==='gut'?'border-color:#8BAF8D;background:#F5FFF5':''}${state.toleranz[l.name]==='testen'?'border-color:#F5C842;':''}">
      <div style="font-size:1.5rem;margin-bottom:4px">${l.e}</div>
      <div class="fw-7 fs-sm mb4">${esc(l.name)}</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap">
        <span class="tag ${tagCls(l.f)}" style="font-size:.62rem">F: ${tagTxt(l.f)}</span>
        <span class="tag ${tagCls(l.r)}" style="font-size:.62rem">R: ${tagTxt(l.r)}</span>
        ${state.toleranz[l.name]==='gut'?'<span title="Vertrage ich" style="font-size:.75rem">😊</span>':''}
        ${state.toleranz[l.name]==='schlecht'?'<span title="Vertrage ich nicht" style="font-size:.75rem">😣</span>':''}
        ${state.toleranz[l.name]==='testen'?'<span title="Teste noch" style="font-size:.75rem">🧪</span>':''}
      </div>
    </div>`).join('')}</div>`;
}

function showLmDetail(l) {
  const existing = document.getElementById('lm-overlay');
  if(existing) existing.remove();

  const tol = state.toleranz[l.name];
  const safeId = 'lm_' + l.name.replace(/[^a-zA-Z0-9]/g,'_');

  // Build toleranz buttons via DOM to avoid quote conflicts
  const el = document.createElement('div');
  el.className = 'overlay centered';
  el.id = 'lm-overlay';
  el.onclick = e => { if(e.target===el) el.remove(); };

  // Info badges HTML (safe strings)
  let infoBadges = '';
  if(l.f==='r') infoBadges += '<span class="tag tag-r">⚠️ High-FODMAP</span> ';
  if(l.f==='y') infoBadges += '<span class="tag tag-y">⚠️ Portionsgröße beachten</span> ';
  if(l.r==='r') infoBadges += '<span style="background:#FFE8D0;color:#9B3B00;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700">🔥 Reflux-Trigger</span> ';
  if(l.f==='g' && l.r==='g') infoBadges += '<span class="tag tag-g">✅ Doppelt grün – ideal!</span>';

  // Toleranz warning box
  let tolBox = '';
  if(tol==='schlecht') tolBox = '<div class="fs-xs" style="margin-top:8px;color:#9B2222;background:#FBDADA;padding:6px 10px;border-radius:8px">Rezepte mit diesem Lebensmittel werden im Kochbuch als ungeeignet markiert.</div>';

  el.innerHTML = `
    <div class="sheet modal-sheet" id="${safeId}_sheet">
      <div class="ta-c" style="margin-bottom:14px">
        <div style="font-size:3rem">${l.e}</div>
        <h2 class="c-warm" style="font-size:1.25rem">${esc(l.name)}</h2>
        <span class="tag tag-gr">${l.kat}</span>
      </div>
      <div class="g2 mb12">
        <div style="background:var(--cream);border-radius:12px;padding:12px;text-align:center">
          <div class="fs-xs fw-7 c-lt mb4">FODMAP</div>
          <span class="tag ${tagCls(l.f)}">${tagTxt(l.f)}</span>
        </div>
        <div style="background:var(--cream);border-radius:12px;padding:12px;text-align:center">
          <div class="fs-xs fw-7 c-lt mb4">Reflux</div>
          <span class="tag ${tagCls(l.r)}">${tagTxt(l.r)}</span>
        </div>
      </div>
      <div style="margin-bottom:14px">
        ${l.info ? '<p class="fs-sm" style="line-height:1.65;color:var(--text);margin-bottom:8px">' + esc(l.info) + '</p>' : ''}
        <div style="display:flex;flex-wrap:wrap;gap:5px">${infoBadges}</div>
      </div>
      <div style="background:var(--cream);border-radius:14px;padding:14px;margin-bottom:14px">
        <div class="fs-xs fw-7 c-lt mb8">🙋 Meine persönliche Verträglichkeit</div>
        <div id="${safeId}_tolBtns" style="display:flex;gap:6px;flex-wrap:wrap"></div>
        <div id="${safeId}_tolMsg">${tolBox}</div>
        <div id="${safeId}_tolReset"></div>
      </div>
      <button class="btn btn-primary btn-full" onclick="document.getElementById('lm-overlay').remove()">Schließen</button>
    </div>`;

  document.body.appendChild(el);

  // Build toleranz buttons via DOM (avoids all quote issues)
  const btnsEl = document.getElementById(safeId + '_tolBtns');
  const resetEl = document.getElementById(safeId + '_tolReset');

  const tolOptions = [
    { status:'gut',      label:'😊 Vertrage ich',   bg:tol==='gut'?'#D6EDD7':'white', border:tol==='gut'?'#2D6B30':'var(--border)', color:tol==='gut'?'#2D6B30':'var(--text-lt)' },
    { status:'testen',   label:'🧪 Teste noch',      bg:tol==='testen'?'#FDF0C0':'white', border:tol==='testen'?'#7A5800':'var(--border)', color:tol==='testen'?'#7A5800':'var(--text-lt)' },
    { status:'schlecht', label:'😣 Vertrage nicht',  bg:tol==='schlecht'?'#FBDADA':'white', border:tol==='schlecht'?'#9B2222':'var(--border)', color:tol==='schlecht'?'#9B2222':'var(--text-lt)' },
  ];

  tolOptions.forEach(opt => {
    const btn = document.createElement('button');
    btn.textContent = opt.label;
    btn.style.cssText = 'flex:1;min-width:80px;padding:8px 6px;border-radius:10px;border:2px solid ' + opt.border + ';background:' + opt.bg + ';cursor:pointer;font-size:.78rem;font-weight:700;color:' + opt.color;
    btn.onclick = () => setToleranzAndRefresh(l.name, opt.status);
    btnsEl.appendChild(btn);
  });

  if(tol) {
    const resetBtn = document.createElement('button');
    resetBtn.textContent = 'Markierung entfernen';
    resetBtn.style.cssText = 'margin-top:8px;background:none;border:none;cursor:pointer;font-size:.72rem;color:var(--text-lt);text-decoration:underline';
    resetBtn.onclick = () => setToleranzAndRefresh(l.name, null);
    resetEl.appendChild(resetBtn);
  }
}

function setToleranzAndRefresh(name, status) {
  if(status === null) {
    const updated = {...state.toleranz};
    delete updated[name];
    save('toleranz', updated);
  } else {
    setToleranz(name, status);
  }
  const lm = LEBENSMITTEL.find(l => l.name === name);
  if(lm) { document.getElementById('lm-overlay')?.remove(); showLmDetail(lm); }
  const grid = document.getElementById('lm-grid');
  if(grid) grid.innerHTML = getLmGrid();
}

let trkDate=today(); let trkFormOpen=false; let trkEditId=null;
let trkForm={name:'',typ:'Frühstück',fodmap:'g',reflux:'g',emoji:'🍽️',notiz:'',bew:0,datum:today(),uhrzeit:nowTime(),zutaten:[]};

function renderTracking() {
  const types=['Frühstück','Mittagessen','Abendessen','Snack','Getränke'];
  const meals=state.mahlzeiten.filter(m=>m.datum===trkDate)
    .sort((a,b)=>types.indexOf(a.typ)-types.indexOf(b.typ));
  const emojis=['🍽️','🥣','🥗','🍲','🍜','🥚','🍳','🥩','🐟','🍗','🥦','🥔','🍌','🥤','🫖','🍵','🫙','🧆'];
  const getraenkeEmojis=['💧','🫖','🍵','☕','🥤','🧃','🍷','🥛','🍺'];

  // Datum-Navigation: Pfeile für Vor/Zurück
  const prevDate = new Date(trkDate); prevDate.setDate(prevDate.getDate()-1);
  const nextDate = new Date(trkDate); nextDate.setDate(nextDate.getDate()+1);
  const nextStr  = nextDate.toISOString().split('T')[0];
  const prevStr  = prevDate.toISOString().split('T')[0];
  const isToday  = trkDate === today();
  const datumLabel = isToday ? 'Heute' :
    new Date(trkDate+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});

  // Getränke-Tageszusammenfassung
  const getraenkeHeute = meals.filter(m=>m.typ==='Getränke');
  const wasserMl = getraenkeHeute.filter(g=>/wasser/i.test(g.name)).reduce((s,g)=>s+(g.menge||0),0);
  const koffeinCount = getraenkeHeute.filter(g=>/kaffee|espresso|schwarzer tee|grüner tee|cola/i.test(g.name)).length;

  return `
    <h1 class="c-warm" style="font-size:1.5rem;margin-bottom:4px">Mahlzeiten-Tracking</h1>
    <p class="fs-xs c-lt mb12">Erfasse Essen & Getränke – auch für vergangene Tage</p>

    <div class="card" style="padding:14px">
      <div class="flex-sb mb12">
        <!-- Datum-Navigation -->
        <div style="display:flex;align-items:center;gap:8px">
          <button onclick="trkDate='${prevStr}';renderPage()" style="background:var(--cream);border:1px solid var(--border);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:.9rem">‹</button>
          <div style="text-align:center">
            <div class="fw-7 fs-sm c-warm">${datumLabel}</div>
            <input type="date" class="input" style="width:140px;padding:4px 8px;font-size:.72rem;margin-top:2px" value="${trkDate}" onchange="trkDate=this.value;renderPage()">
          </div>
          <button onclick="trkDate='${nextStr}';renderPage()" style="background:var(--cream);border:1px solid var(--border);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:.9rem${isToday?';opacity:.3;pointer-events:none':''}">›</button>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-secondary btn-sm" onclick="trkEditId=null;trkForm={name:'',typ:'Getränke',fodmap:'g',reflux:'g',emoji:'💧',notiz:'',bew:0,menge:null,datum:trkDate,uhrzeit:nowTime(),zutaten:[]};trkFormOpen=true;renderPage()" title="Getränk erfassen">🥤 +</button>
          <button class="btn btn-primary btn-sm" onclick="trkEditId=null;trkForm={name:'',typ:'Frühstück',fodmap:'g',reflux:'g',emoji:'🍽️',notiz:'',bew:0,menge:null,datum:trkDate,uhrzeit:nowTime(),zutaten:[]};trkFormOpen=true;renderPage()">
            + Erfassen
          </button>
        </div>
      </div>

      ${trkFormOpen ? renderTrkForm(emojis, getraenkeEmojis, types) : ''}
    </div>

    ${getraenkeHeute.length>0 ? `
    <div class="card" style="padding:12px 14px;background:linear-gradient(135deg,#E8F2F8,#D8E8F0)">
      <div class="fw-7 fs-sm c-warm" style="margin-bottom:4px">💧 Getränke heute: ${getraenkeHeute.length}</div>
      <div class="fs-xs c-lt">
        ${wasserMl>0?`${wasserMl}ml Wasser`:''}
        ${wasserMl>0&&koffeinCount>0?' · ':''}
        ${koffeinCount>0?`${koffeinCount}× koffeinhaltig`:''}
        ${wasserMl===0&&koffeinCount===0?'Erfasst, aber ohne Mengenangabe':''}
      </div>
    </div>`:''}

    ${meals.length===0&&!trkFormOpen?`
    <div class="card ta-c" style="padding:28px 16px">
      <div style="font-size:2.5rem;margin-bottom:8px">🍽️</div>
      <p class="c-lt fs-sm">Noch keine Mahlzeiten für diesen Tag.</p>
      <button class="btn btn-primary btn-sm mt12" onclick="trkEditId=null;trkForm={name:'',typ:'Frühstück',fodmap:'g',reflux:'g',emoji:'🍽️',notiz:'',bew:0,menge:null,datum:trkDate,uhrzeit:nowTime(),zutaten:[]};trkFormOpen=true;renderPage()">Jetzt eintragen</button>
    </div>`:''}

    ${types.map(typ=>{
      const g=meals.filter(m=>m.typ===typ);
      if(!g.length) return '';
      return `
        <div class="sect-hd">${typ==='Getränke'?'🥤 Getränke':typ}</div>
        ${g.map(m=>`
        <div class="card" style="padding:12px 14px;margin-bottom:8px">
          <div class="flex-sb">
            <div class="flex-c" style="gap:10px;flex:1;min-width:0">
              <span style="font-size:1.4rem;flex-shrink:0">${m.emoji||'🍽️'}</span>
              <div style="min-width:0">

            </div>
          </div>

}

        <button class="btn btn-secondary btn-sm" onclick="symFormTyp='stuhl';symFormOpen=true;renderPage()">💩 Stuhlgang</button>

      </div>

    <!-- Alle anderen Tage mit Einträgen -->
    ${andereTageMitDaten.length ? `

      ${alleDaten.map(datum=>{

    <span style="display:inline-block;width:60px;height:5px;background:var(--border);border-radius:5px;overflow:hidden">
      <span style="display:block;width:${pct}%;height:100%;background:${col};border-radius:5px"></span>
    </span>

}

function editSym(id) {
  const s = (state.symptomZeit||[]).find(x=>x.id===id);
  if(!s) return;
  symEditId = id;
  symFormTyp = 'symptom';
  symForm = { symptome:[...(s.symptome||[])], intensitaet:s.intensitaet||3, uhrzeit:s.uhrzeit||nowTime(), notiz:s.notiz||'', datum:s.datum||symDate };
  symFormOpen = true;
  symDate = s.datum;
  renderPage();
  setTimeout(()=>document.querySelector('.main')?.scrollTo({top:0,behavior:'smooth'}),80);
}

function editStuhl(id) {
  const s = (state.stuhlLogs||[]).find(x=>x.id===id);
  if(!s) return;
  stuhlEditId = id;
  symFormTyp = 'stuhl';
  stuhlForm = { bristolTyp:s.bristolTyp||4, uhrzeit:s.uhrzeit||nowTime(), notiz:s.notiz||'', datum:s.datum||symDate };
  symFormOpen = true;
  symDate = s.datum;
  renderPage();
  setTimeout(()=>document.querySelector('.main')?.scrollTo({top:0,behavior:'smooth'}),80);
}

function saveSymptom() {
  if(!symForm.symptome.length) { alert('Bitte mindestens ein Symptom auswählen'); return; }
  const datum = document.getElementById('sym-datum-input')?.value || symForm.datum || symDate;
  const uhrzeit = document.getElementById('sym-uhrzeit-input')?.value || symForm.uhrzeit || nowTime();
  const entry = { ...symForm, datum, uhrzeit };

  let updated;
  if(symEditId !== null) {
    updated = (state.symptomZeit||[]).map(s => s.id===symEditId ? {...s,...entry} : s);
    symEditId = null;
  } else {
    updated = [...(state.symptomZeit||[]), {...entry, id:Date.now()}];
  }
  save('symptomZeit', updated);
  symDate = datum;
  symForm = { symptome:[], intensitaet:3, uhrzeit:nowTime(), notiz:'', datum:symDate };
  symFormOpen = false;
  renderPage();
}

function saveStuhl() {
  const datum = document.getElementById('stuhl-datum-input')?.value || stuhlForm.datum || symDate;
  const uhrzeit = document.getElementById('stuhl-uhrzeit-input')?.value || stuhlForm.uhrzeit || nowTime();
  const entry = { ...stuhlForm, datum, uhrzeit };

  let updated;
  if(stuhlEditId !== null) {
    updated = (state.stuhlLogs||[]).map(s => s.id===stuhlEditId ? {...s,...entry} : s);
    stuhlEditId = null;
  } else {
    updated = [...(state.stuhlLogs||[]), {...entry, id:Date.now()}];
  }
  save('stuhlLogs', updated);
  symDate = datum;
  stuhlForm = { bristolTyp:4, uhrzeit:nowTime(), notiz:'', datum:symDate };
  symFormOpen = false;
  renderPage();
}

function deleteSym(id) {
  save('symptomZeit', (state.symptomZeit||[]).filter(s=>s.id!==id));
  renderPage();
}

function deleteStuhl(id) {
  save('stuhlLogs', (state.stuhlLogs||[]).filter(s=>s.id!==id));
  renderPage();
}

  const isEdit = trkEditId !== null;
  const isGetraenk = trkForm.typ === 'Getränke';

  // Gespeicherte Gerichte für Schnellauswahl (nur Mahlzeiten, nicht Getränke)
  const gerichte = (state.gespeicherteGerichte||[]).filter(g=>g.typ!=='Getränke');
  // Passende Rezepte aus dem Kochbuch
  const rezeptMatches = !isGetraenk && trkForm.name.length >= 2
    ? allRezepte().filter(r=>r.name.toLowerCase().includes(trkForm.name.toLowerCase())).slice(0,3)
    : [];

  return `

}

// ── Zutaten-Hilfsfunktionen ───────────────────────────────────────
function trkZutatHinzufuegen() {
  const container = document.getElementById('zutaten-suche-container');
  if(container) {
    container.style.display = 'block';
    document.getElementById('zutaten-suche')?.focus();
  }
}

function renderZutatenSuche(query) {
  const container = document.getElementById('zutaten-ergebnisse');
  if(!container) return;
  if(!query.trim()) { container.innerHTML=''; return; }

  const treffer = LEBENSMITTEL.filter(l=>
    l.name.toLowerCase().includes(query.toLowerCase())
  ).slice(0,8);

  container.innerHTML = treffer.map(l=>`
    <div onclick="trkZutatAusListeHinzufuegen('${l.name.replace(/'/g,"\\'")}', '${l.f}', '${l.r}')"
      style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:white;border-radius:8px;border:1px solid var(--border);cursor:pointer">
      <span>${l.e}</span>
      <span class="fs-sm fw-7 flex-1">${esc(l.name)}</span>
      <span class="tag ${tagCls(l.f)}" style="font-size:.6rem">F</span>
      <span class="tag ${tagCls(l.r)}" style="font-size:.6rem">R</span>
    </div>`).join('') || '<p class="fs-xs c-lt" style="padding:6px">Nichts gefunden — eigene Zutat eingeben</p>';
}

function trkZutatAusListeHinzufuegen(name, f, r) {
  if(!trkForm.zutaten) trkForm.zutaten = [];
  if(trkForm.zutaten.some(z=>z.name===name)) return;
  trkForm.zutaten = [...trkForm.zutaten, {name, f, r}];
  document.getElementById('zutaten-suche-container').style.display='none';
  renderPage();
}

function trkZutatEigenHinzufuegen() {
  const input = document.getElementById('zutaten-eigen');
  const name = input?.value?.trim();
  if(!name) return;
  if(!trkForm.zutaten) trkForm.zutaten = [];
  if(!trkForm.zutaten.some(z=>z.name===name)) {
    trkForm.zutaten = [...trkForm.zutaten, {name, f:'y', r:'y'}];
  }
  input.value = '';
  document.getElementById('zutaten-suche-container').style.display='none';
  renderPage();
}

function trkZutatEntfernen(idx) {
  trkForm.zutaten = trkForm.zutaten.filter((_,i)=>i!==idx);
  renderPage();
}

function ladeGespeichertesGericht(idx) {
  const g = (state.gespeicherteGerichte||[])[idx];
  if(!g) return;
  trkForm = { ...trkForm, name:g.name, emoji:g.emoji||'🍽️', typ:g.typ||trkForm.typ,
              fodmap:g.fodmap||'g', reflux:g.reflux||'g', zutaten:[...(g.zutaten||[])] };
  renderPage();
}

function ladeRezeptZutaten(id) {
  const r = allRezepte().find(x=>x.id===id);
  if(!r) return;
  // Zutaten aus Rezept in strukturierte Form umwandeln
  const zutaten = (r.zutaten||[]).map(z=>{
    // Rohstring parsen: "200g Zucchini" → Name extrahieren
    const namePart = z.replace(/^\d+[.,]?\d*\s*(g|kg|ml|l|EL|TL|Stk\.?|Stück|cm|x)?\s*/i,'').replace(/\(.*?\)/g,'').trim();
    const lm = LEBENSMITTEL.find(l=>namePart.toLowerCase().includes(l.name.toLowerCase().split(' ')[0]));
    return { name: lm?lm.name:namePart, f:lm?lm.f:'y', r:lm?lm.r:'y', originalText:z };
  }).filter(z=>z.name.length>1);

  trkForm = { ...trkForm, name:r.name, emoji:r.e||r.emoji||'🍽️',
              fodmap:'g', reflux:'g', zutaten };
  renderPage();
}

function editMahlzeit(id) {
  const m = state.mahlzeiten.find(x => x.id === id);
  if(!m) return;
  trkEditId = id;
  trkForm = { name:m.name, typ:m.typ||'Frühstück', fodmap:m.fodmap||'g', reflux:m.reflux||'g',
              emoji:m.emoji||'🍽️', notiz:m.notiz||'', bew:m.bew||0, menge:m.menge||null,
              uhrzeit:m.uhrzeit||nowTime(), datum:m.datum||trkDate, zutaten:m.zutaten||[] };
  trkFormOpen = true;
  trkDate = m.datum || trkDate; // zur richtigen Tag springen
  renderPage();
  // Scroll zum Formular
  setTimeout(()=>document.querySelector('.main')?.scrollTo({top:0,behavior:'smooth'}),100);
}

function saveMahlzeit() {
  const name = document.getElementById('trkName')?.value || trkForm.name;
  if(!name.trim()) { alert('Bitte einen Namen eingeben'); return; }
  const emoji = document.getElementById('trkEmoji')?.value || trkForm.emoji;
  const updated = { ...trkForm, name, emoji };

  if(trkEditId !== null) {
    save('mahlzeiten', state.mahlzeiten.map(m => m.id === trkEditId ? { ...m, ...updated } : m));
    trkEditId = null;
  } else {
    save('mahlzeiten', [...state.mahlzeiten, { ...updated, id: Date.now() }]);
  }

  // Gericht automatisch in Schnellauswahl speichern (wenn Zutaten vorhanden)
  if(updated.zutaten?.length > 0 && updated.typ !== 'Getränke') {
    const gerichte = state.gespeicherteGerichte || [];
    const existing = gerichte.findIndex(g => g.name.toLowerCase() === name.toLowerCase());
    const gericht = { name, emoji, typ: updated.typ, fodmap: updated.fodmap, reflux: updated.reflux, zutaten: updated.zutaten };
    if(existing >= 0) {
      // Zutaten aktualisieren wenn Gericht schon bekannt
      gerichte[existing] = { ...gerichte[existing], ...gericht };
      save('gespeicherteGerichte', [...gerichte]);
    } else {
      save('gespeicherteGerichte', [...gerichte, { ...gericht, id: Date.now() }]);
    }
  }

  trkDate = updated.datum;
  trkForm = { name:'', typ:'Frühstück', fodmap:'g', reflux:'g', emoji:'🍽️', notiz:'', bew:0, menge:null, datum:trkDate, uhrzeit:nowTime(), zutaten:[] };
  trkFormOpen = false;
  renderPage();
}

function deleteMahlzeit(id) {
  save('mahlzeiten', state.mahlzeiten.filter(m => m.id !== id));
  trkFormOpen = false;
  trkEditId = null;
  renderPage();
}

// ── KOCHBUCH ───────────────────────────────────────────────────────
let kbSuche=''; let kbKat='Alle'; let kbNeuOpen=false; let kbFilter='alle'; let kbZyklus='alle';
let kbNeu={name:'',emoji:'🍽️',kat:'Mittagessen',min:30,level:'Einfach',zutaten:'',zub:'',tags:''};

function renderKochbuch() {
  const rezepte=allRezepte();
  const kats=['Alle','Frühstück','Mittagessen','Abendessen','Snack'];
  const filtered=rezepte.filter(r=>{
    const ms=r.name.toLowerCase().includes(kbSuche.toLowerCase())||r.tags?.some(t=>t.toLowerCase().includes(kbSuche.toLowerCase()));
    const mk=kbKat==='Alle'||r.kat===kbKat||r.kategorie===kbKat;
    return ms&&mk;
  });

  const letzterLog=state.symptomLogs[state.symptomLogs.length-1];
  const todayLog=letzterLog?.datum===today()?letzterLog:null;
  const phase=getCurrentPhase(state.zyklusStart,state.zyklusLaenge);
  const schlechtCount=Object.values(state.toleranz).filter(v=>v==='schlecht').length;

  return `
    <h1 class="c-warm" style="font-size:1.5rem;margin-bottom:4px">Kochbuch</h1>
    <p class="fs-xs c-lt mb8">${rezepte.length} Rezepte · ${REZEPTE.length} eingebaut · ${state.eigeneRezepte.length} eigene</p>

    ${todayLog||schlechtCount>0?`
    <div style="background:linear-gradient(135deg,#EDF5EE,#D8EDD9);border-radius:14px;padding:12px 14px;margin-bottom:14px">
      <div class="fw-7" style="font-size:.8rem;color:var(--warm);margin-bottom:6px">🎯 Rezepte werden angepasst an:</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;font-size:.72rem">
        ${todayLog&&(todayLog.schmerz??0)>=7?'<span class="tag tag-y">🔴 Starke Bauchschmerzen</span>':''}
        ${todayLog&&(todayLog.reflux??0)>=7?'<span class="tag tag-y">🔥 Starker Reflux</span>':''}
        ${todayLog&&(todayLog.schmerz??0)<5&&(todayLog.reflux??0)<5?'<span class="tag tag-g">💚 Guter Tag</span>':''}
        ${phase?`<span class="tag tag-p">${phase.icon} ${phase.name}</span>`:''}
        ${schlechtCount>0?`<span class="tag tag-r">😣 ${schlechtCount} Unverträglichkeit${schlechtCount>1?'en':''}</span>`:''}
      </div>
    </div>`:''}

    <div class="card" style="padding:14px">
      <input class="input mb8" placeholder="🔍 Rezept oder Tag suchen..." oninput="kbSuche=this.value;refreshKbGrid()" value="${esc(kbSuche)}">
      <div class="flex" style="gap:8px">
        <select class="select" onchange="kbKat=this.value;refreshKbGrid()">
          ${kats.map(k=>`<option${kbKat===k?' selected':''}>${k}</option>`).join('')}
        </select>
        <button class="btn btn-primary btn-sm" onclick="kbNeuOpen=!kbNeuOpen;renderPage()" style="white-space:nowrap">+ Eigenes</button>
      </div>
      <div id="kb-filters" style="margin-top:8px">
        ${renderKbFilters()}
      </div>
    </div>

    ${kbNeuOpen?`
    <div class="card">
      <div class="card-title">Neues Rezept hinzufügen</div>
      <div class="g2">
        <div class="field"><label class="label">Name *</label><input class="input" id="kb-name" placeholder="Rezeptname" value="${esc(kbNeu.name)}" oninput="kbNeu.name=this.value"></div>
        <div class="field"><label class="label">Emoji</label><input class="input" id="kb-emoji" value="${kbNeu.emoji}" oninput="kbNeu.emoji=this.value" style="font-size:1.3rem"></div>
        <div class="field"><label class="label">Kategorie</label><select class="select" onchange="kbNeu.kat=this.value">${['Frühstück','Mittagessen','Abendessen','Snack'].map(k=>`<option${kbNeu.kat===k?' selected':''}>${k}</option>`).join('')}</select></div>
        <div class="field"><label class="label">Dauer (Min)</label><input type="number" class="input" value="${kbNeu.min}" oninput="kbNeu.min=Number(this.value)"></div>
      </div>
      <div class="field"><label class="label">Zutaten (eine pro Zeile)</label><textarea class="textarea" rows="4" oninput="kbNeu.zutaten=this.value" placeholder="200g Hähnchen&#10;1 Zucchini&#10;...">${esc(kbNeu.zutaten)}</textarea></div>
      <div class="field"><label class="label">Zubereitung</label><textarea class="textarea" rows="4" oninput="kbNeu.zub=this.value">${esc(kbNeu.zub)}</textarea></div>
      <div class="field"><label class="label">Tags (kommagetrennt)</label><input class="input" placeholder="Low-FODMAP, Glutenfrei, Schnell" oninput="kbNeu.tags=this.value" value="${esc(kbNeu.tags)}"></div>
      <div class="flex">
        <button class="btn btn-primary" onclick="saveEigenesRezept()">✅ Speichern</button>
        <button class="btn btn-secondary" onclick="kbNeuOpen=false;renderPage()">Abbrechen</button>
      </div>
    </div>`:''}

    <div id="kb-grid">${getKbGrid()}</div>
  `;
}

function renderKbFilters() {
  const schnell = [
    {id:'alle',        label:'Alle'},
    {id:'ideal',       label:'✨ Ideal jetzt'},
    {id:'favoriten',   label:'🧡 Favoriten'},
    {id:'vertraeglich',label:'😊 Verträglich'},
    {id:'schonkost',   label:'🌿 Schonkost'},
  ];
  const zyklus = [
    {id:'alle',         label:'🗓️ Alle'},
    {id:'menstruation', label:'🌕 Periode'},
    {id:'follikel',     label:'🌱 Follikel'},
    {id:'ovulation',    label:'🌸 Eisprung'},
    {id:'luteal',       label:'🍂 Luteal'},
  ];
  return `
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px">
      <span class="fs-xs fw-7 c-lt" style="align-self:center">Filter:</span>
      ${schnell.map(f=>`<button class="btn btn-xs ${kbFilter===f.id?'btn-primary':'btn-secondary'}"
        onclick="kbFilter='${f.id}';refreshKbGrid()">${f.label}</button>`).join('')}
    </div>

      <span class="fs-xs fw-7 c-lt" style="align-self:center">Zyklus:</span>

function refreshKbGrid() {
  // Grid aktualisieren
  const grid = document.getElementById('kb-grid');
  if(grid) grid.innerHTML = getKbGrid();
  // Filter-Buttons neu rendern damit aktiver Button korrekt hervorgehoben wird
  const filters = document.getElementById('kb-filters');
  if(filters) filters.innerHTML = renderKbFilters();
}

function getKbGrid() {
  const rezepte = getRezepteForSituation(kbKat==='Alle'?null:kbKat);
  const lm_schlecht = Object.entries(state.toleranz).filter(([k,v])=>v==='schlecht').map(([k])=>k.toLowerCase().split(' ')[0]);

  const filtered = rezepte.filter(r=>{
    // Suchtext
    const ms = r.name.toLowerCase().includes(kbSuche.toLowerCase()) ||
               (r.tags||[]).some(t=>t.toLowerCase().includes(kbSuche.toLowerCase()));
    if(!ms) return false;

    // Schnellfilter
    if(kbFilter==='favoriten')    return (state.lesezeichen||[]).includes(r.id);
    if(kbFilter==='ideal')        return (r._score?.score||0) >= 90;
    if(kbFilter==='vertraeglich') return !lm_schlecht.some(lm=>(r.zutaten||[]).some(z=>z.toLowerCase().includes(lm)));
    if(kbFilter==='schonkost')   return (r.tags||[]).some(t=>t==='Schonkost'||t==='Reflux-OK');

    // Zyklusfilter
    if(kbZyklus !== 'alle') {
      const rz = r.zyklus || r.zyklusPhase || ['alle'];
      if(!rz.includes('alle') && !rz.includes(kbZyklus)) return false;
    }

    return true;
  });

  if(!filtered.length) return '<p class="c-lt ta-c" style="padding:28px 0">Keine Rezepte gefunden 🔍<br><span class="fs-xs">Filter anpassen oder Suche leeren</span></p>';

  let html = '';

  if(kbFilter === 'favoriten') {
    if(!filtered.length) return '<div style="text-align:center;padding:32px 16px"><div style="font-size:2rem">🤍</div><p class="c-lt fs-sm mt8">Noch keine Favoriten gespeichert.<br>Tippe auf 🤍 in einem Rezept um es zu merken.</p></div>';
    html += `<div class="sect-hd">🧡 Deine Favoriten · ${filtered.length} Rezepte</div>`;
    html += filtered.map(r=>rezeptCard(r)).join('');
    return html;
  }

  if(kbFilter === 'ideal') {
    // Nur top-Rezepte, klar als solche gekennzeichnet
    html += `<div class="sect-hd" style="display:flex;align-items:center;gap:6px">✨ Ideal für jetzt · ${filtered.length} Rezepte <span style="font-size:.63rem;color:var(--text-lt);font-weight:400">(Zustand + Zyklus + Verträglichkeit)</span></div>`;
    html += filtered.map(r=>rezeptCard(r)).join('');
    return html;
  }

  if(kbZyklus !== 'alle') {
    // Zyklusfilter aktiv: flach mit Phasen-Label
    const phaseName = ({menstruation:'🌕 Periode',follikel:'🌱 Follikelphase',ovulation:'🌸 Eisprung',luteal:'🍂 Lutealphase'})[kbZyklus];
    html += `<div class="sect-hd">${phaseName} · ${filtered.length} Rezepte</div>`;
    html += filtered.map(r=>rezeptCard(r)).join('');
    return html;
  }

  if(kbFilter !== 'alle') {
    // Anderer Schnellfilter: flach mit Label
    const filterName = ({vertraeglich:'😊 Verträglich',schonkost:'🌿 Schonkost'})[kbFilter] || '';
    html += `<div class="sect-hd">${filterName} · ${filtered.length} Rezepte</div>`;
    html += filtered.map(r=>rezeptCard(r)).join('');
    return html;
  }

  // "Alle" — zeige alle Rezepte alphabetisch / nach Kategorie, KEIN automatisches Ideal-Grouping
  // Damit ist "Alle" wirklich alle, ohne versteckte Sortierung
  const byKat = {};
  filtered.forEach(r => {
    const k = r.kat || r.kategorie || 'Sonstiges';
    if(!byKat[k]) byKat[k] = [];
    byKat[k].push(r);
  });
  const katOrder = ['Frühstück','Mittagessen','Abendessen','Snack'];
  katOrder.forEach(k => {
    if(!byKat[k]?.length) return;
    html += `<div class="sect-hd">${k} (${byKat[k].length})</div>`;
    html += byKat[k].map(r=>rezeptCard(r)).join('');
  });
  // Unbekannte Kategorien
  Object.entries(byKat).forEach(([k,rs]) => {
    if(katOrder.includes(k)) return;
    html += `<div class="sect-hd">${k} (${rs.length})</div>`;
    html += rs.map(r=>rezeptCard(r)).join('');
  });
  return html;
}

function generatePlan() {
  const plan={};
  const lm_schlecht = Object.entries(state.toleranz).filter(([k,v])=>v==='schlecht').map(([k])=>k.toLowerCase().split(' ')[0]);

  WD.forEach(tag=>{
    MT.forEach(typ=>{
      // Nutze smart scoring
      const scored = getRezepteForSituation(typ)
        .filter(r=>{
          // Keine unverträglichen Zutaten
          const hatUnv = lm_schlecht.length > 0 && (r.zutaten||[]).some(z=>lm_schlecht.some(lm=>z.toLowerCase().includes(lm)));
          return !hatUnv;
        });
      if(!scored.length) return;
      // Top 5 nehmen, zufällig einen wählen (verhindert Wiederholungen)
      const top = scored.slice(0,Math.min(8,scored.length));
      plan[tag+'_'+typ]=top[Math.floor(Math.random()*top.length)];
    });
  });
  save('wochenplan',plan);
  renderPage();
}

function generateShoppingList() {
  const alle = [];
  Object.values(state.wochenplan).forEach(r => { if(r?.zutaten) alle.push(...r.zutaten); });

  // ── Zutaten intelligent zusammenführen ─────────────────────────
  // Schritt 1: Jede Zutat in Menge + Einheit + Name zerlegen
  const parsed = alle.map(z => parseZutat(z));

  // Schritt 2: Nach normalisiertem Zutat-Namen gruppieren
  const grouped = {};
  parsed.forEach(p => {
    const key = p.name;
    if(!grouped[key]) {
      grouped[key] = { name: p.name, amounts: [], originals: [] };
    }
    if(p.amount) grouped[key].amounts.push({ amount: p.amount, unit: p.unit });
    grouped[key].originals.push(p.original);
  });

  // Schritt 3: Pro Gruppe eine zusammengefasste Zeile erzeugen
  const merged = Object.values(grouped).map(g => {
    if(g.amounts.length === 0) return g.name;

    // Gleiche Einheiten addieren
    const unitTotals = {};
    g.amounts.forEach(a => {
      const u = a.unit || '';
      unitTotals[u] = (unitTotals[u] || 0) + a.amount;
    });

    const parts = Object.entries(unitTotals).map(([unit, total]) => {
      // Schöne Zahlenformatierung (1.5 → 1½, 0.25 → ¼ etc.)
      const pretty = formatAmount(total);
      return unit ? `${pretty} ${unit}` : pretty;
    });

    return `${parts.join(' + ')} ${g.name}`;
  });

  // Sortieren: nach Kategorie / alphabetisch
  const sorted = merged.sort((a, b) => {
    const catA = getZutatKategorie(a);
    const catB = getZutatKategorie(b);
    if(catA !== catB) return catA.localeCompare(catB);
    return a.localeCompare(b);
  });

  save('einkaufsliste', sorted.map(z => ({ text: z, done: false, id: Date.now() + Math.random() })));
}

function generateShoppingList() {
  const alle = [];
  Object.values(state.wochenplan).forEach(r => { if(r?.zutaten) alle.push(...r.zutaten); });

  // Jede Zutatenzeile aufsplitten (manche haben "Salz, Pfeffer" in einer Zeile)
  const expanded = [];
  alle.forEach(z => {
    // Trenne an Komma/Semikolon nur wenn danach kein Leerzeichen+Klammer kommt
    // "Salz, Pfeffer" → ["Salz","Pfeffer"], aber "Quark (laktosefrei), 100g" bleibt
    const parts = z.split(/,(?![^(]*\))/);
    parts.forEach(p => { if(p.trim()) expanded.push(p.trim()); });
  });

  // Alle Zutaten parsen
  const parsed = expanded.map(z => parseZutatSmart(z));

  // Nach kanonischem Namen gruppieren
  const grouped = {};
  parsed.forEach(p => {
    const key = p.canon;
    if(!grouped[key]) grouped[key] = { label: p.label, canon: p.canon, amounts: [] };
    if(p.amount !== null) grouped[key].amounts.push({ amount: p.amount, unit: p.unit });
  });

  // Pro Gruppe Ausgabe-Text erzeugen
  const merged = Object.values(grouped).map(g => {
    if(g.amounts.length === 0) return g.label;
    const unitTotals = {};
    g.amounts.forEach(a => {
      const u = a.unit || '';
      unitTotals[u] = (unitTotals[u] || 0) + a.amount;
    });
    const parts = Object.entries(unitTotals).map(([u, tot]) =>
      u ? `${formatAmount(tot)} ${u}` : formatAmount(tot)
    );
    return `${parts.join(' + ')} ${g.label}`;
  });

  // Nach Supermarkt-Reihenfolge sortieren
  merged.sort((a, b) => {
    const oa = getSupermarktOrder(a);
    const ob = getSupermarktOrder(b);
    if(oa !== ob) return oa - ob;
    return a.localeCompare(b, 'de');
  });

  save('einkaufsliste', merged.map(z => ({ text: z, done: false, id: Date.now() + Math.random() })));
}

function parseZutatSmart(str) {
  const orig = str.trim();
  const lower = orig.toLowerCase()
    .replace(/\s*\(ohne.*?\)/g,'')      // "(ohne Zwiebeln)" entfernen
    .replace(/\s*\(vorgekocht\)/g,'')
    .replace(/\s*\(gegrillt\)/g,'')
    .replace(/\s*\(aufgetaut\)/g,'')
    .replace(/\s*\(abgespült\)/g,'')
    .replace(/\s*als beilage/g,'')
    .replace(/!$/,'')
    .replace(/\s+/g,' ').trim();

  // Füllwörter entfernen die vor Zutaten stehen
  const stripped = lower
    .replace(/^(frisch(e[rns]?)?\s+)/,'')
    .replace(/^(etwas|wenig|prise|eine prise|etwas frisch(e[rns]?)?)\s+/,'')
    .replace(/^(nach geschmack|zum servieren|zum garnieren|zum bestreuen)\s*/,'')
    .trim();

  // Direkt im Wörterbuch nachschlagen (ganzer String)
  if(ZUTATEN_DICT[lower]) {
    return { ...parseAmount(lower, ZUTATEN_DICT[lower]), original: orig };
  }
  if(ZUTATEN_DICT[stripped]) {
    return { ...parseAmount(lower, ZUTATEN_DICT[stripped]), original: orig };
  }

  // Menge + Name trennen, dann Name im Wörterbuch suchen
  const { amount, unit, namePart } = extractAmountUnit(lower);
  const nameStripped = namePart
    .replace(/^(frisch(e[rns]?)?\s+)/,'')
    .replace(/\s*\([^)]*\)/g,'')   // alle Klammerinhalte weg
    .trim();

  if(ZUTATEN_DICT[namePart])      return { canon: ZUTATEN_DICT[namePart].canon, label: ZUTATEN_DICT[namePart].label, amount, unit, original: orig };
  if(ZUTATEN_DICT[nameStripped])  return { canon: ZUTATEN_DICT[nameStripped].canon, label: ZUTATEN_DICT[nameStripped].label, amount, unit, original: orig };

  // Partieller Match: suche ob ein Dict-Schlüssel im String vorkommt
  const keys = Object.keys(ZUTATEN_DICT).sort((a,b)=>b.length-a.length); // längste zuerst
  for(const k of keys) {
    if(nameStripped.includes(k) || lower.includes(k)) {
      return { canon: ZUTATEN_DICT[k].canon, label: ZUTATEN_DICT[k].label, amount, unit, original: orig };
    }
  }

  // Unbekannte Zutat: sauber formatieren und behalten
  const label = nameStripped.charAt(0).toUpperCase() + nameStripped.slice(1);
  const canon = 'unknown_' + label.toLowerCase().replace(/\s+/g,'_');
  return { canon, label, amount, unit, original: orig };
}

function parseAmount(str, dictEntry) {
  const { amount, unit } = extractAmountUnit(str);
  return { canon: dictEntry.canon, label: dictEntry.label, amount, unit };
}

function extractAmountUnit(s) {
  const fractions = { '½':0.5, '¼':0.25, '¾':0.75, '⅓':0.333, '⅔':0.667 };
  // Muster: Zahl + Einheit + Rest
  const m1 = s.match(/^([½¼¾⅓⅔]|\d+(?:[.,]\d+)?)\s*(g|kg|ml|l|el|tl|tasse|stk\.?|stück|cm|x)\.?\s+(.+)$/i);
  if(m1) {
    const amount = fractions[m1[1]] ?? parseFloat(m1[1].replace(',','.'));
    return { amount, unit: m1[2].toUpperCase().replace('.',''), namePart: m1[3].trim() };
  }
  // Nur Zahl + Rest (keine Einheit)
  const m2 = s.match(/^(\d+(?:[.,]\d+)?)\s+(.+)$/);
  if(m2) {
    return { amount: parseFloat(m2[1].replace(',','.')), unit: null, namePart: m2[2].trim() };
  }
  return { amount: null, unit: null, namePart: s };
}

function formatAmount(num) {
  if(Math.abs(num - Math.round(num)) < 0.05) return String(Math.round(num));
  if(Math.abs(num - 0.5)  < 0.05) return '½';
  if(Math.abs(num - 0.25) < 0.05) return '¼';
  if(Math.abs(num - 0.75) < 0.05) return '¾';
  if(Math.abs(num - 0.33) < 0.05) return '⅓';
  if(Math.abs(num - 0.67) < 0.05) return '⅔';
  return num.toFixed(1).replace('.0','');
}

];

function getSupermarktOrder(text) {
  const lower = text.toLowerCase();
  for(const abt of SUPERMARKT_ABTEILUNGEN) {
    if(abt.keys.some(k => lower.includes(k))) return abt.order;
  }
  return 99; // Sonstiges ans Ende
}

function getAbteilungsName(text) {
  const lower = text.toLowerCase();
  for(const abt of SUPERMARKT_ABTEILUNGEN) {
    if(abt.keys.some(k => lower.includes(k))) return abt.name;
  }
  return '🛒 Sonstiges';
}

// Legacy-Kompatibilität
function getZutatKategorie(zutat) { return getAbteilungsName(zutat); }

function renderShopByKategorie(items) {
  // Gruppiere nach Supermarkt-Abteilung (nutzt SUPERMARKT_ABTEILUNGEN aus generateShoppingList)
  const groups = {};

  items.forEach(item => {
    const abt = getAbteilungsName(item.text);
    if(!groups[abt]) groups[abt] = [];
    groups[abt].push(item);
  });

  // Sortiere Abteilungen nach Supermarkt-Reihenfolge
  const sortedAbteilungen = Object.keys(groups).sort((a, b) => {
    const oa = SUPERMARKT_ABTEILUNGEN.find(x=>x.name===a)?.order ?? 99;
    const ob = SUPERMARKT_ABTEILUNGEN.find(x=>x.name===b)?.order ?? 99;
    return oa - ob;
  });

  let html = '';
  sortedAbteilungen.forEach(abt => {
    const gruppeItems = groups[abt];
    if(!gruppeItems?.length) return;
    const offen = gruppeItems.filter(i=>!i.done).length;
    html += `
      <div style="margin-bottom:14px">
        <div style="font-size:.7rem;font-weight:800;color:var(--warm-lt);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between">
          <span>${abt}</span>
          ${offen===0?'<span style="color:var(--sage);font-size:.68rem;font-weight:700">✓ alles da</span>':'<span style="color:var(--text-lt);font-size:.65rem;font-weight:400">'+offen+' offen</span>'}
        </div>
        ${gruppeItems.map(item=>`
        <div class="shop-item${item.done?' done':''}">
          <input type="checkbox" class="shop-check" ${item.done?'checked':''} onchange="toggleShopItem('${item.id}')">
          <span class="fs-sm">${esc(item.text)}</span>
        </div>`).join('')}
      </div>`;
  });

  return html || '<p class="c-lt fs-sm">Keine Einträge</p>';
}

function toggleShopItem(id) {
  save('einkaufsliste',state.einkaufsliste.map(i=>i.id==id?{...i,done:!i.done}:i));

}

- Reizdarmsyndrom (Low-FODMAP, Langzeiternährung – weiß was sie verträgt)
- Sodbrennen und saures Aufstoßen

Aktuell:
${letzterLog?`Letzter Check: Bauch ${letzterLog.schmerz??5}/10, Reflux ${letzterLog.reflux??5}/10, Stimmung ${letzterLog.stimmung??5}/10`:'Kein Check vorhanden'}
${heutigeMeals.length?`Heutige Mahlzeiten: ${heutigeMeals.map(m=>m.name).join(', ')}`:'Noch keine Mahlzeiten heute'}

- Maximal 4-5 Sätze, klar und hilfreich

// ── Lebensmittel-Verträglichkeit: Statistik je Lebensmittel ─────────
function renderLebensmittelKorrelation(meals) {
  // Gruppiere Mahlzeiten nach Lebensmittel-Stichwort (extrahiert aus Name)
  const stats = {}; // { stichwort: { bewertungen:[], fodmap, reflux, count } }

  meals.forEach(m => {
    if(!m.bew || m.bew === 0) return; // nur bewertete Mahlzeiten zählen
    // Zerlege den Namen in Wörter, suche bekannte Lebensmittel-Stichworte
    const nameLower = m.name.toLowerCase();
    LEBENSMITTEL.forEach(lm => {
      const stichwort = lm.name.toLowerCase().split(' ')[0].split('(')[0].trim();
      if(stichwort.length < 3) return;
      if(nameLower.includes(stichwort)) {
        if(!stats[lm.name]) stats[lm.name] = { bewertungen: [], fodmap: lm.f, reflux: lm.r, count: 0 };
        stats[lm.name].bewertungen.push(m.bew);
        stats[lm.name].count++;
      }
    });
  });

  // Nur Lebensmittel mit mind. 2 Datenpunkten
  const relevante = Object.entries(stats).filter(([k,v]) => v.count >= 2);
  if(!relevante.length) return '';

  // Durchschnitt berechnen, sortieren: schlechteste zuerst
  const mitDurchschnitt = relevante.map(([name, v]) => ({
    name, ...v,
    avg: v.bewertungen.reduce((a,b)=>a+b,0) / v.bewertungen.length
  })).sort((a,b) => a.avg - b.avg);

  const schlecht = mitDurchschnitt.filter(x => x.avg <= 2.5);
  const gut = mitDurchschnitt.filter(x => x.avg >= 4);

  // ÜBERRASCHEND: FODMAP-arme Lebensmittel die trotzdem schlecht vertragen werden
  const ueberraschend = schlecht.filter(x => x.fodmap === 'g');

  return `
    <div class="card">
      <div class="card-title">🍽️ Lebensmittel-Verträglichkeit</div>
      <p class="fs-xs c-lt mb12">Basierend auf deinen Sterne-Bewertungen nach dem Essen</p>

      ${ueberraschend.length ? `
      <div style="background:#FFF0E0;border:1.5px solid #F5C5A3;border-radius:12px;padding:12px 14px;margin-bottom:14px">
        <div class="fw-7" style="font-size:.85rem;color:#9B5800;margin-bottom:6px">⚠️ Überraschender Fund</div>
        <p class="fs-sm" style="line-height:1.6;margin-bottom:8px">Diese Lebensmittel gelten eigentlich als <strong>Low-FODMAP</strong> (grün), du verträgst sie laut deinen Bewertungen aber trotzdem schlecht:</p>
        ${ueberraschend.map(x=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #F5C5A3">
          <span class="fs-sm fw-7">${esc(x.name)}</span>
          <span class="fs-xs">${'⭐'.repeat(Math.round(x.avg))} <span class="c-lt">(Ø ${x.avg.toFixed(1)}, ${x.count}× gegessen)</span></span>
        </div>`).join('')}
        <p class="fs-xs c-lt mt8">💡 Mögliche Ursachen: individuelle Unverträglichkeit (z.B. Histamin), Zubereitungsart, oder Kombination mit anderen Zutaten. Markiere diese Lebensmittel im Verzeichnis als "Vertrage ich nicht".</p>
      </div>` : ''}

      ${schlecht.length ? `
      <div class="mb12">
        <div class="fw-7 fs-sm" style="color:#9B2222;margin-bottom:6px">😣 Häufig schlecht vertragen</div>
        ${schlecht.slice(0,6).map(x=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#FFF5F5;border-radius:8px;margin-bottom:4px">
          <span class="fs-sm">${esc(x.name)} <span class="tag ${tagCls(x.fodmap)}" style="font-size:.6rem;margin-left:4px">F</span></span>
          <span class="fs-xs c-lt">${'⭐'.repeat(Math.round(x.avg))} (${x.count}×)</span>
        </div>`).join('')}
      </div>` : ''}

      ${gut.length ? `
      <div>
        <div class="fw-7 fs-sm" style="color:#2D6B30;margin-bottom:6px">😊 Gut vertragen</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px">
          ${gut.slice(0,8).map(x=>`<span class="tag tag-g" style="font-size:.75rem">${esc(x.name)} (${x.count}×)</span>`).join('')}
        </div>
      </div>` : ''}

      ${!schlecht.length && !gut.length ? '<p class="fs-sm c-lt">Noch nicht genug bewertete Mahlzeiten für eine Aussage.</p>' : ''}
    </div>`;
}

// ── Schlaf-Korrelation ────────────────────────────────────────────
function renderSchlafKorrelation(logs) {
  const valide = logs.filter(l => l.schlaf !== undefined && l.schmerz !== undefined);
  if(valide.length < 5) return '';

  const schlechterSchlaf = valide.filter(l => l.schlaf <= 4);
  const guterSchlaf = valide.filter(l => l.schlaf >= 7);

  if(schlechterSchlaf.length < 2 || guterSchlaf.length < 2) return '';

  const avgSchmerzSchlecht = schlechterSchlaf.reduce((s,l)=>s+(l.schmerz??0),0) / schlechterSchlaf.length;
  const avgSchmerzGut = guterSchlaf.reduce((s,l)=>s+(l.schmerz??0),0) / guterSchlaf.length;
  const avgRefluxSchlecht = schlechterSchlaf.reduce((s,l)=>s+(l.reflux??0),0) / schlechterSchlaf.length;
  const avgRefluxGut = guterSchlaf.reduce((s,l)=>s+(l.reflux??0),0) / guterSchlaf.length;

  const diffSchmerz = avgSchmerzSchlecht - avgSchmerzGut;
  const diffReflux = avgRefluxSchlecht - avgRefluxGut;
  const relevant = Math.abs(diffSchmerz) >= 1 || Math.abs(diffReflux) >= 1;

  if(!relevant) return `
    <div class="card">
      <div class="card-title">😴 Schlaf & Beschwerden</div>
      <p class="fs-sm c-lt">Kein deutlicher Zusammenhang zwischen Schlafqualität und Beschwerden erkennbar.</p>
    </div>`;

  return `
    <div class="card">
      <div class="card-title">😴 Schlaf & Beschwerden</div>
      <p class="fs-sm" style="line-height:1.7;margin-bottom:12px">
        An Tagen nach <strong>schlechtem Schlaf</strong> (${schlechterSchlaf.length} Tage) waren deine Beschwerden im Schnitt
        ${diffSchmerz >= 1 ? `<strong style="color:#9B2222">${diffSchmerz.toFixed(1)} Punkte stärker</strong>` : 'ähnlich'}
        ${diffReflux >= 1 ? ` und Reflux <strong style="color:#9B2222">${diffReflux.toFixed(1)} Punkte stärker</strong>` : ''}
        als nach gutem Schlaf (${guterSchlaf.length} Tage).
      </p>
      <div class="g2">
        <div style="background:#FFF5F5;border-radius:10px;padding:10px;text-align:center">
          <div class="fs-xs c-lt">😴 Schlechter Schlaf</div>
          <div class="fw-8" style="color:#9B2222">${avgSchmerzSchlecht.toFixed(1)}/10</div>
          <div class="fs-xs c-lt">Bauchbeschwerden</div>
        </div>
        <div style="background:#EDF5EE;border-radius:10px;padding:10px;text-align:center">
          <div class="fs-xs c-lt">✨ Guter Schlaf</div>
          <div class="fw-8" style="color:#2D6B30">${avgSchmerzGut.toFixed(1)}/10</div>
          <div class="fs-xs c-lt">Bauchbeschwerden</div>
        </div>
      </div>
      <p class="fs-xs c-lt mt8">💡 Schlafmangel kann die Darm-Hirn-Achse beeinflussen und die Schmerzwahrnehmung erhöhen.</p>
    </div>`;
}

// ── Stress-Korrelation ────────────────────────────────────────────
function renderStressKorrelation(logs) {
  const valide = logs.filter(l => l.stress !== undefined && l.schmerz !== undefined);
  if(valide.length < 5) return '';

  const hoherStress = valide.filter(l => l.stress >= 7);
  const niedrigerStress = valide.filter(l => l.stress <= 3);
  if(hoherStress.length < 2 || niedrigerStress.length < 2) return '';

  const avgSchmerzHoch = hoherStress.reduce((s,l)=>s+(l.schmerz??0),0) / hoherStress.length;
  const avgSchmerzNiedrig = niedrigerStress.reduce((s,l)=>s+(l.schmerz??0),0) / niedrigerStress.length;
  const diff = avgSchmerzHoch - avgSchmerzNiedrig;

  if(Math.abs(diff) < 1) return '';

  return `
    <div class="card">
      <div class="card-title">⚡ Stress & Bauchbeschwerden</div>
      <p class="fs-sm" style="line-height:1.7;margin-bottom:12px">
        An Tagen mit <strong>hohem Stress</strong> (${hoherStress.length} Tage) waren deine Bauchbeschwerden im Schnitt
        <strong style="color:${diff>0?'#9B2222':'#2D6B30'}">${Math.abs(diff).toFixed(1)} Punkte ${diff>0?'stärker':'schwächer'}</strong>
        als an entspannten Tagen (${niedrigerStress.length} Tage).
      </p>
      <div class="g2">
        <div style="background:#FFF5F5;border-radius:10px;padding:10px;text-align:center">
          <div class="fs-xs c-lt">⚡ Hoher Stress</div>

        </div>
      </div>
      <p class="fs-xs c-lt mt8">💡 Die Darm-Hirn-Achse macht Stress zu einem der stärksten Reizdarm-Trigger – stärker als manche Lebensmittel.</p>
